<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>校園訂購平台</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #444;
      font-size: 14px;
    }

    .hero {
      margin: 35px auto;
      width: 86%;
      max-width: 1100px;
      min-height: 330px;
      border-radius: 8px;
      background: linear-gradient(135deg, #dfe9ff, #f7f9ff);
      display: flex;
      align-items: center;
      padding: 50px;
    }

    .hero-text {
      max-width: 600px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 18px;
    }

    .hero p {
      font-size: 17px;
      line-height: 1.8;
      color: #666;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 4px;
      background: #222;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      width: 86%;
      max-width: 1100px;
      margin: 50px auto;
    }

    .section-title {
      font-size: 25px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 6px;
      padding: 25px;
      min-height: 150px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #777;
      line-height: 1.6;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .hero {
        padding: 30px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      nav {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🏫 校園訂購平台</div>

    <nav>
      <a href="#">首頁</a>
      <a href="#">商品</a>
      <a href="#">我的訂單</a>
      <a href="#">登入</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>讓校園訂購<br>變得更簡單</h1>

      <p>
        集中管理校園商品訂購，
        讓同學、班代與學生會都能更方便地處理訂單。
      </p>

      <a href="#" class="button">開始訂購 →</a>
    </div>
  </section>

  <section class="section">

    <h2 class="section-title">目前服務</h2>

    <div class="cards">

      <div class="card">
        <h3>🛍️ 校園商品</h3>
        <p>
          查看目前開放訂購的商品、尺寸與價格。
        </p>
      </div>

      <div class="card">
        <h3>📋 我的訂單</h3>
        <p>
          查看自己的訂單與過去的訂購紀錄。
        </p>
      </div>

      <div class="card">
        <h3>📢 最新公告</h3>
        <p>
          查看學生會發布的訂購相關公告。
        </p>
      </div>

    </div>

  </section>

  <footer>
    校園訂購平台 © 2026
  </footer>

</body>
</html>
