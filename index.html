<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>校園訂購平台</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #202020;
    }

    /* ===== 導覽列 ===== */

    header {
      height: 72px;
      background: #ffffff;
      border-bottom: 1px solid #dddddd;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 7%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #444444;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #000000;
    }

    /* ===== 主視覺 ===== */

    .hero {
      width: 86%;
      max-width: 1150px;

      margin: 45px auto 0;

      min-height: 360px;

      background: #e9ecef;

      display: flex;
      align-items: center;

      padding: 55px;

      border-radius: 8px;
    }

    .hero-content {
      max-width: 620px;
    }

    .small-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #666666;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 46px;
      line-height: 1.25;
      margin-bottom: 20px;
    }

    .hero p {
      color: #666666;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .main-button {
      display: inline-block;

      background: #202020;
      color: white;

      text-decoration: none;

      padding: 13px 24px;

      border-radius: 4px;

      font-size: 14px;
    }

    .main-button:hover {
      background: #444444;
    }

    /* ===== 公告 ===== */

    .section {
      width: 86%;
      max-width: 1150px;
      margin: 55px auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
    }

    .section-title {
      font-size: 23px;
    }

    .more {
      font-size: 13px;
      color: #777777;
    }

    .announcement {
      background: white;

      border: 1px solid #dddddd;

      padding: 22px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-radius: 5px;
    }

    .announcement-title {
      font-weight: 600;
      margin-bottom: 7px;
    }

    .announcement-text {
      color: #777777;
      font-size: 14px;
    }

    .announcement-date {
      color: #999999;
      font-size: 13px;
    }

    /* ===== 商品 ===== */

    .products {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 20px;
    }

    .product {
      background: white;

      border: 1px solid #dddddd;

      border-radius: 5px;

      overflow: hidden;
    }

    .product-image {
      height: 210px;

      background: #eeeeee;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999999;
      font-size: 14px;
    }

    .product-info {
      padding: 20px;
    }

    .product-name {
      font-size: 17px;
      font-weight: 600;

      margin-bottom: 8px;
    }

    .product-description {
      color: #888888;

      font-size: 13px;

      margin-bottom: 15px;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-weight: 600;
    }

    .view-button {
      border: 1px solid #222222;

      background: white;

      padding: 8px 13px;

      border-radius: 3px;

      font-size: 12px;

      cursor: pointer;
    }

    .view-button:hover {
      background: #222222;
      color: white;
    }

    /* ===== Footer ===== */

    footer {
      border-top: 1px solid #dddddd;

      margin-top: 80px;

      padding: 30px;

      text-align: center;

      color: #888888;

      font-size: 13px;
    }

    /* ===== 平板／手機 ===== */

    @media (max-width: 750px) {

      header {
        padding: 0 5%;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 12px;
      }

      .hero {
        width: 90%;
        padding: 35px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .section {
        width: 90%;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .announcement {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
      }
    }
  </style>
</head>


<body>

  <!-- 導覽列 -->

  <header>

    <div class="logo">
      🏫 校園訂購平台
    </div>

    <nav>
      <a href="#">首頁</a>
      <a href="product.html">商品</a>

    </nav>

  <!-- 主視覺 -->

  <section class="hero">

      </p>

  </section>

        </div>

      </div>

      <div class="announcement-date">

    </div>

  </section>


  <!-- 商品 -->

  <section class="section">

    <div class="section-header">

      <h2 class="section-title">
        熱門商品
      </h2>

      <span class="more">

      </span>

    </div>


    <div class="products">


      <div class="product">

          商品圖片
        </div>

        <div class="product-info">

          <div class="product-name">
            校園紀念 T-shirt
          </div>

          <div class="product-description">
            115 學年度紀念服
          </div>

          <div class="product-bottom">

            <div class="price">
              NT$ 450
            </div>

            <button class="view-button">
              查看商品
            </button>

          </div>

        </div>

      </div>


      <div class="product">

        <div class="product-image">
          商品圖片
        </div>

        <div class="product-info">

          <div class="product-name">
            校園紀念外套
          </div>

          <div class="product-description">
            校園限定紀念商品
          </div>

          <div class="product-bottom">

            <div class="price">
              NT$ 850
            </div>

            <button class="view-button">
              查看商品
            </button>

          </div>

        </div>

      </div>


      <div class="product">

        <div class="product-image">
          商品圖片
        </div>

        <div class="product-info">

          <div class="product-name">
            校園紀念帆布袋
          </div>

          <div class="product-description">
            日常使用的校園紀念品
          </div>

          <div class="product-bottom">

            <div class="price">
              NT$ 250
            </div>

            <button class="view-button">
              查看商品
            </button>

          </div>

        </div>

      </div>


    </div>

  </section>


  <footer>
    校園訂購平台 © 2026
  </footer>


</body>
</html>
