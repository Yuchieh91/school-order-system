<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園訂購系統</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .login-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-email {
      font-size: 14px;
      color: #555;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }

    .google-btn {
      background: #222;
      color: white;
      padding: 10px 18px;
      border-radius: 4px;
    }

    .google-btn:hover {
      opacity: 0.85;
    }

    .logout-btn {
      background: white;
      border: 1px solid #ddd;
      padding: 9px 15px;
      border-radius: 4px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .hero {
      background: white;
      padding: 50px;
      border: 1px solid #e5e7eb;
    }

    .hero h1 {
      margin: 0 0 15px;
      font-size: 36px;
    }

    .hero p {
      color: #666;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 30px;
    }

    .menu a {
      display: block;
      background: white;
      border: 1px solid #e5e7eb;
      padding: 25px;
      text-decoration: none;
      color: #222;
      transition: 0.2s;
    }

    .menu a:hover {
      border-color: #999;
      transform: translateY(-2px);
    }

    .menu-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .menu-text {
      color: #777;
      font-size: 14px;
    }

    .login-message {
      margin-top: 25px;
      padding: 15px;
      background: #f3f4f6;
      color: #555;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .header {
        padding: 15px;
      }

      .user-email {
        display: none;
      }

      .container {
        padding: 30px 15px;
      }

      .hero {
        padding: 30px 20px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">校園訂購系統</div>

    <div class="login-area" id="loginArea">
      <button class="google-btn" id="googleLoginBtn">
        使用 Google 登入
      </button>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>校園訂購系統</h1>

      <p>
        在這裡可以查看校園商品、建立訂單，
        並查看自己的訂購紀錄。
      </p>

      <div id="loginMessage" class="login-message">
        請先使用 Google 帳號登入。
      </div>
    </section>

    <section class="menu">

      <a href="product.html">
        <div class="menu-title">商品瀏覽</div>
        <div class="menu-text">
          查看目前可以購買的校園商品
        </div>
      </a>

      <a href="orders.html">
        <div class="menu-title">我的訂單</div>
        <div class="menu-text">
          查看自己的訂購紀錄
        </div>
      </a>

      <a href="student-profile.html">
        <div class="menu-title">學生資料</div>
        <div class="menu-text">
          查看與設定學生基本資料
        </div>
      </a>

    </section>

  </main>

  <script>

    // ==============================
    // ① 填入你的 Supabase 資訊
    // ==============================

    const SUPABASE_URL = "https://oanccvcpiixtameutjdl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PdSvLOKj8kYTJWan7ivnbQ_G5QIO2ma";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==============================
    // ② Google 登入
    // ==============================

    const googleLoginBtn =
      document.getElementById("googleLoginBtn");

    googleLoginBtn.addEventListener("click", async () => {

      const { error } =
        await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: "https://scorde.vercel.app"
          }
        });

      if (error) {
        alert("登入失敗：" + error.message);
      }

    });


    // ==============================
    // ③ 顯示目前登入狀態
    // ==============================

    async function updateLoginStatus() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      const loginArea =
        document.getElementById("loginArea");

      const loginMessage =
        document.getElementById("loginMessage");


      if (session) {

        const user = session.user;

        loginArea.innerHTML = `
          <span class="user-email">
            ${user.email || ""}
          </span>

          <button class="logout-btn" id="logoutBtn">
            登出
          </button>
        `;

        loginMessage.innerHTML =
          "已登入，可以開始使用校園訂購系統。";

        document
          .getElementById("logoutBtn")
          .addEventListener("click", async () => {

            await supabaseClient.auth.signOut();

            location.reload();

          });

      } else {

        loginArea.innerHTML = `
          <button class="google-btn" id="googleLoginBtn">
            使用 Google 登入
          </button>
        `;

        document
          .getElementById("googleLoginBtn")
          .addEventListener("click", async () => {

            const { error } =
              await supabaseClient.auth.signInWithOAuth({
                provider: "google",
                options: {
                  redirectTo:
                    window.location.origin + "/index.html"
                }
              });

            if (error) {
              alert("登入失敗：" + error.message);
            }

          });

      }

    }


    // ==============================
    // ④ 啟動
    // ==============================

    updateLoginStatus();

  </script>

</body>
</html>
