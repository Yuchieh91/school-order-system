<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理後台｜校園訂購系統</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #333;
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 14px;
    }

    nav a:hover {
      background: #f0f0f0;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .page-title {
      margin-bottom: 24px;
    }

    .page-title h2 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .page-title p {
      margin: 0;
      color: #666;
    }

    .section {
      background: #fff;
      border: 1px solid #e3e5e8;
      padding: 24px;
      margin-bottom: 24px;
    }

    .section h3 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .stat-card {
      border: 1px solid #e3e5e8;
      padding: 18px;
      background: #fafafa;
    }

    .stat-card .label {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-card .number {
      font-size: 28px;
      font-weight: 700;
    }

    .product-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #ccc;
      background: white;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #f2f2f2;
    }

    .primary-btn {
      background: #222;
      color: white;
      border-color: #222;
    }

    .primary-btn:hover {
      background: #444;
    }

    .danger-btn {
      color: #b42318;
      border-color: #e3b4b0;
    }

    .product-list {
      display: grid;
      gap: 12px;
    }

    .product-row {
      border: 1px solid #e3e5e8;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .product-info h4 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .product-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #666;
      font-size: 13px;
    }

    .tag {
      border: 1px solid #ddd;
      padding: 3px 8px;
      background: #fafafa;
    }

    .active-tag {
      color: #176b3a;
      border-color: #b9dec8;
      background: #f1faf4;
    }

    .inactive-tag {
      color: #a33a32;
      border-color: #e7c2bf;
      background: #fff5f4;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .form-area {
      border-top: 1px solid #eee;
      margin-top: 20px;
      padding-top: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
    }

    .checkbox-row input {
      width: auto;
    }

    .size-help {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .form-buttons {
      margin-top: 18px;
      display: flex;
      gap: 8px;
    }

    .message {
      margin-top: 14px;
      padding: 12px;
      display: none;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #f0faf3;
      border: 1px solid #b9dec8;
      color: #176b3a;
    }

    .message.error {
      display: block;
      background: #fff5f4;
      border: 1px solid #e7c2bf;
      color: #a33a32;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .feature-card {
      border: 1px solid #e3e5e8;
      padding: 18px;
      background: #fafafa;
    }

    .feature-card h4 {
      margin: 0 0 8px;
    }

    .feature-card p {
      margin: 0;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #777;
      border: 1px dashed #ccc;
    }

    .loading {
      color: #777;
      padding: 20px 0;
    }

    @media (max-width: 800px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .feature-grid {
        grid-template-columns: 1fr;
      }

      .product-row {
        grid-template-columns: 1fr;
      }

      .product-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 550px) {
      main {
        padding: 20px 14px 40px;
      }

      .section {
        padding: 18px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>校園訂購系統｜管理後台</h1>

  <nav>
    <a href="index.html">首頁</a>
    <a href="product.html">商品</a>
    <a href="orders.html">我的訂單</a>
    <a href="class-rep.html">班代後台</a>
  </nav>
</header>

<main>

  <div class="page-title">
    <h2>管理後台</h2>
    <p id="loginStatus">正在確認管理員身分...</p>
  </div>

  <section class="section">
    <h3>訂單統計</h3>

    <div class="stats">
      <div class="stat-card">
        <div class="label">有效訂單</div>
        <div class="number" id="validOrders">0</div>
      </div>

      <div class="stat-card">
        <div class="label">未付款</div>
        <div class="number" id="unpaidOrders">0</div>
      </div>

      <div class="stat-card">
        <div class="label">已付款</div>
        <div class="number" id="paidOrders">0</div>
      </div>

      <div class="stat-card">
        <div class="label">已取消</div>
        <div class="number" id="cancelledOrders">0</div>
      </div>
    </div>
  </section>


  <section class="section">

    <div class="product-toolbar">
      <div>
        <h3 style="margin-bottom: 4px;">商品管理</h3>
        <div style="color:#666;font-size:14px;">
          新增、修改或上下架校園商品
        </div>
      </div>

      <button class="primary-btn" onclick="openAddForm()">
        ＋ 新增商品
      </button>
    </div>

    <div id="productList" class="product-list">
      <div class="loading">正在載入商品...</div>
    </div>


    <div id="formArea" class="form-area" style="display:none;">

      <h3 id="formTitle">新增商品</h3>

      <div class="form-grid">

        <div class="form-group">
          <label for="productName">商品名稱</label>
          <input
            id="productName"
            type="text"
            placeholder="例如：校園紀念 T-shirt"
          />
        </div>

        <div class="form-group">
          <label for="productCategory">商品分類</label>
          <input
            id="productCategory"
            type="text"
            placeholder="例如：上衣、文具、其他"
          />
        </div>

        <div class="form-group">
          <label for="productPrice">價格</label>
          <input
            id="productPrice"
            type="number"
            min="0"
            placeholder="450"
          />
        </div>

        <div class="form-group">
          <label>尺寸</label>

          <div class="checkbox-row">
            <input id="productHasSize" type="checkbox" onchange="toggleSizeInput()" />

            <label for="productHasSize" style="font-weight:normal;">
              此商品需要選擇尺寸
            </label>
          </div>
        </div>


        <div
          class="form-group full"
          id="sizeInputGroup"
          style="display:none;"
        >

          <label for="productSizes">
            尺寸選項
          </label>

          <input
            id="productSizes"
            type="text"
            placeholder="例如：S, M, L, XL"
          />

          <div class="size-help">
            請用逗號分隔不同尺寸，例如：S, M, L, XL
          </div>

        </div>


        <div class="form-group full">

          <label for="productDescription">
            商品說明
          </label>

          <textarea
            id="productDescription"
            placeholder="輸入商品介紹、注意事項等..."
          ></textarea>

        </div>

      </div>


      <div class="form-buttons">

        <button class="primary-btn" onclick="saveProduct()">
          儲存商品
        </button>

        <button onclick="cancelForm()">
          取消
        </button>

      </div>

      <div id="formMessage" class="message"></div>

    </div>

  </section>


  <section class="section">

    <h3>班級付款狀態</h3>

    <div id="classStatus">
      <div class="empty">
        目前資料仍使用舊版瀏覽器訂單資料。
      </div>
    </div>

  </section>


  <section class="section">

    <h3>商品訂購統計</h3>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">

      <select id="productSelect" style="max-width:350px;">
        <option value="">請選擇商品</option>
      </select>

      <button onclick="exportProductCSV()">
        匯出商品統計 CSV
      </button>

      <button onclick="exportOrdersCSV()">
        匯出訂單 CSV
      </button>

    </div>

    <div id="productStats" style="margin-top:20px;"></div>

  </section>


  <section class="section">

    <h3>系統管理</h3>

    <div class="feature-grid">

      <div class="feature-card">
        <h4>學年度管理</h4>
        <p>
          未來可以在這裡設定目前學年度與自動切換日期。
        </p>
      </div>

      <div class="feature-card">
        <h4>公告管理</h4>
        <p>
          未來可以新增、修改首頁公告。
        </p>
      </div>

      <div class="feature-card">
        <h4>系統設定</h4>
        <p>
          未來可以管理訂購期限與其他系統設定。
        </p>
      </div>

    </div>

  </section>

</main>


<script>

  const SUPABASE_URL = "https://oanccvcpiixtameutjdl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PdSvLOKj8kYTJWan7ivnbQ_G5QIO2ma";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  let currentUser = null;
  let editingProductId = null;
  let products = [];


  async function init() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

      document.getElementById("loginStatus").textContent =
        "尚未登入，請先登入。";

      alert("請先登入 Google 帳號。");

      window.location.href = "index.html";

      return;
    }

    currentUser = session.user;

    await checkAdmin();

  }


  async function checkAdmin() {

    const { data, error } = await supabaseClient
      .from("admin_users")
      .select("email")
      .eq("email", currentUser.email)
      .maybeSingle();

    if (error) {

      console.error(error);

      document.getElementById("loginStatus").textContent =
        "確認管理員權限時發生錯誤。";

      return;
    }

    if (!data) {

      document.getElementById("loginStatus").textContent =
        "你目前沒有管理員權限。";

      alert("此 Google 帳號不是管理員。");

      return;
    }

    document.getElementById("loginStatus").textContent =
      "目前登入：" + currentUser.email;

    await loadProducts();

    loadOldOrderStats();

  }


  async function loadProducts() {

    const { data, error } = await supabaseClient
      .from("products")
      .select(
        "id,name,category,price,has_size,sizes,description,active"
      )
      .order("id", { ascending: true });

    if (error) {

      console.error(error);

      document.getElementById("productList").innerHTML =
        '<div class="empty">商品載入失敗。</div>';

      return;
    }

    products = data || [];

    renderProducts();

    loadProductSelect();

  }


  function renderProducts() {

    const container =
      document.getElementById("productList");

    if (!products.length) {

      container.innerHTML =
        '<div class="empty">目前還沒有商品。</div>';

      return;
    }

    container.innerHTML = products.map(product => {

      const statusClass =
        product.active
          ? "active-tag"
          : "inactive-tag";

      const statusText =
        product.active
          ? "上架中"
          : "已下架";

      const sizeText =
        product.has_size
          ? (
              product.sizes && product.sizes.length
                ? "尺寸：" + product.sizes.join(" / ")
                : "需要尺寸"
            )
          : "不需要尺寸";

      return `
        <div class="product-row">

          <div class="product-info">

            <h4>${escapeHtml(product.name)}</h4>

            <div class="product-meta">

              <span class="tag">
                ${escapeHtml(product.category || "未分類")}
              </span>

              <span class="tag">
                NT$ ${Number(product.price).toLocaleString()}
              </span>

              <span class="tag">
                ${escapeHtml(sizeText)}
              </span>

              <span class="tag ${statusClass}">
                ${statusText}
              </span>

            </div>

            ${
              product.description
                ? `
                  <div style="
                    margin-top:10px;
                    color:#666;
                    font-size:14px;
                  ">
                    ${escapeHtml(product.description)}
                  </div>
                `
                : ""
            }

          </div>

          <div class="product-actions">

            <button onclick="editProduct('${product.id}')">
              編輯
            </button>

            <button
              class="${product.active ? "danger-btn" : ""}"
              onclick="toggleProduct('${product.id}', ${product.active})"
            >
              ${product.active ? "下架" : "重新上架"}
            </button>

          </div>

        </div>
      `;

    }).join("");

  }


  function toggleSizeInput() {

    const hasSize =
      document.getElementById("productHasSize").checked;

    const sizeGroup =
      document.getElementById("sizeInputGroup");

    sizeGroup.style.display =
      hasSize ? "flex" : "none";

    if (!hasSize) {
      document.getElementById("productSizes").value = "";
    }

  }


  function openAddForm() {

    editingProductId = null;

    document.getElementById("formTitle").textContent =
      "新增商品";

    document.getElementById("productName").value = "";
    document.getElementById("productCategory").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productHasSize").checked = false;
    document.getElementById("productSizes").value = "";
    document.getElementById("productDescription").value = "";

    toggleSizeInput();

    clearMessage();

    document.getElementById("formArea").style.display =
      "block";

    document.getElementById("formArea")
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

  }


  function editProduct(id) {

    const product =
      products.find(p => String(p.id) === String(id));

    if (!product) return;

    editingProductId = product.id;

    document.getElementById("formTitle").textContent =
      "編輯商品";

    document.getElementById("productName").value =
      product.name || "";

    document.getElementById("productCategory").value =
      product.category || "";

    document.getElementById("productPrice").value =
      product.price ?? "";

    document.getElementById("productHasSize").checked =
      !!product.has_size;

    document.getElementById("productSizes").value =
      Array.isArray(product.sizes)
        ? product.sizes.join(", ")
        : "";

    document.getElementById("productDescription").value =
      product.description || "";

    toggleSizeInput();

    clearMessage();

    document.getElementById("formArea").style.display =
      "block";

    document.getElementById("formArea")
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

  }


  async function saveProduct() {

    const name =
      document.getElementById("productName")
        .value.trim();

    const category =
      document.getElementById("productCategory")
        .value.trim();

    const price =
      Number(
        document.getElementById("productPrice")
          .value
      );

    const hasSize =
      document.getElementById("productHasSize")
        .checked;

    const sizeText =
      document.getElementById("productSizes")
        .value.trim();

    const description =
      document.getElementById("productDescription")
        .value.trim();


    if (!name) {
      showMessage("請輸入商品名稱。", "error");
      return;
    }

    if (!category) {
      showMessage("請輸入商品分類。", "error");
      return;
    }

    if (Number.isNaN(price) || price < 0) {
      showMessage("請輸入正確的商品價格。", "error");
      return;
    }


    let sizes = [];

    if (hasSize) {

      sizes = sizeText
        .split(",")
        .map(size => size.trim())
        .filter(size => size !== "");

      if (!sizes.length) {

        showMessage(
          "此商品需要尺寸，請至少輸入一個尺寸。",
          "error"
        );

        return;
      }

    }


    const productData = {
      name,
      category,
      price,
      has_size: hasSize,
      sizes,
      description
    };


    let result;


    if (editingProductId === null) {

      result = await supabaseClient
        .from("products")
        .insert({
          ...productData,
          active: true
        });

    } else {

      result = await supabaseClient
        .from("products")
        .update(productData)
        .eq("id", editingProductId);

    }


    if (result.error) {

      console.error(result.error);

      showMessage(
        "儲存失敗：" + result.error.message,
        "error"
      );

      return;
    }


    showMessage(
      editingProductId === null
        ? "商品新增成功！"
        : "商品修改成功！",
      "success"
    );


    await loadProducts();


    setTimeout(() => {
      cancelForm();
    }, 800);

  }


  async function toggleProduct(id, currentActive) {

    const action =
      currentActive
        ? "下架"
        : "重新上架";

    const confirmed =
      confirm(`確定要${action}這個商品嗎？`);

    if (!confirmed) return;


    const { error } = await supabaseClient
      .from("products")
      .update({
        active: !currentActive
      })
      .eq("id", id);


    if (error) {

      console.error(error);

      alert("操作失敗：" + error.message);

      return;
    }


    await loadProducts();

  }


  function cancelForm() {

    document.getElementById("formArea").style.display =
      "none";

    editingProductId = null;

    clearMessage();

  }


  function showMessage(text, type) {

    const box =
      document.getElementById("formMessage");

    box.textContent = text;

    box.className =
      "message " + type;

  }


  function clearMessage() {

    const box =
      document.getElementById("formMessage");

    box.textContent = "";

    box.className = "message";

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function loadOldOrderStats() {

    const orders =
      JSON.parse(
        localStorage.getItem("schoolOrders") || "[]"
      );


    let valid = 0;
    let unpaid = 0;
    let paid = 0;
    let cancelled = 0;


    orders.forEach(order => {

      if (order.cancelled) {

        cancelled++;

        return;
      }

      valid++;

      if (order.paymentStatus === "paid") {
        paid++;
      } else {
        unpaid++;
      }

    });


    document.getElementById("validOrders")
      .textContent = valid;

    document.getElementById("unpaidOrders")
      .textContent = unpaid;

    document.getElementById("paidOrders")
      .textContent = paid;

    document.getElementById("cancelledOrders")
      .textContent = cancelled;


    loadClassStatus(orders);

  }


  function loadClassStatus(orders) {

    const container =
      document.getElementById("classStatus");

    if (!orders.length) {

      container.innerHTML =
        '<div class="empty">目前沒有舊版訂單資料。</div>';

      return;
    }


    const classes = {};


    orders.forEach(order => {

      if (order.cancelled) return;

      const className =
        order.className || "未分類";

      if (!classes[className]) {

        classes[className] = {
          total: 0,
          paid: 0
        };

      }

      classes[className].total++;

      if (order.paymentStatus === "paid") {
        classes[className].paid++;
      }

    });


    const rows =
      Object.entries(classes)
        .sort()
        .map(([className, data]) => {

          return `
            <div style="
              display:flex;
              justify-content:space-between;
              border-bottom:1px solid #eee;
              padding:12px 0;
            ">
              <span>${escapeHtml(className)}</span>

              <span>
                ${data.paid} / ${data.total} 筆已付款
              </span>
            </div>
          `;

        })
        .join("");


    container.innerHTML = rows;

  }


  function loadProductSelect() {

    const select =
      document.getElementById("productSelect");

    select.innerHTML =
      '<option value="">請選擇商品</option>';


    products.forEach(product => {

      const option =
        document.createElement("option");

      option.value = product.id;

      option.textContent =
        product.name;

      select.appendChild(option);

    });


    select.onchange = showProductStats;

  }


  function showProductStats() {

    const productId =
      document.getElementById("productSelect").value;

    const container =
      document.getElementById("productStats");


    if (!productId) {

      container.innerHTML = "";

      return;
    }


    const orders =
      JSON.parse(
        localStorage.getItem("schoolOrders") || "[]"
      );


    const product =
      products.find(
        p => String(p.id) === String(productId)
      );


    let quantity = 0;


    orders.forEach(order => {

      if (order.cancelled) return;

      if (!order.items) return;


      order.items.forEach(item => {

        if (
          String(item.productId) === String(productId)
        ) {
          quantity += Number(item.quantity || 0);
        }

      });

    });


    container.innerHTML = `
      <div class="feature-card">
        <h4>${escapeHtml(product?.name || "商品")}</h4>

        <p>
          目前訂購數量：
          <strong style="font-size:20px;">
            ${quantity}
          </strong>
          件
        </p>
      </div>
    `;

  }


  function exportProductCSV() {

    const productId =
      document.getElementById("productSelect").value;

    if (!productId) {

      alert("請先選擇商品。");

      return;
    }


    const product =
      products.find(
        p => String(p.id) === String(productId)
      );


    const orders =
      JSON.parse(
        localStorage.getItem("schoolOrders") || "[]"
      );


    const rows = [
      ["商品名稱", "訂購數量"]
    ];


    let quantity = 0;


    orders.forEach(order => {

      if (order.cancelled) return;

      if (!order.items) return;


      order.items.forEach(item => {

        if (
          String(item.productId) === String(productId)
        ) {

          quantity += Number(item.quantity || 0);

        }

      });

    });


    rows.push([
      product?.name || "",
      quantity
    ]);


    downloadCSV(
      rows,
      "product-statistics.csv"
    );

  }


  function exportOrdersCSV() {

    const orders =
      JSON.parse(
        localStorage.getItem("schoolOrders") || "[]"
      );


    if (!orders.length) {

      alert("目前沒有訂單資料。");

      return;
    }


    const rows = [
      [
        "訂單編號",
        "學生",
        "班級",
        "座號",
        "總金額",
        "付款狀態",
        "取消狀態"
      ]
    ];


    orders.forEach(order => {

      rows.push([
        order.id || "",
        order.studentName || "",
        order.className || "",
        order.seatNumber || "",
        order.total || "",
        order.paymentStatus || "unpaid",
        order.cancelled ? "已取消" : ""
      ]);

    });


    downloadCSV(
      rows,
      "orders.csv"
    );

  }


  function downloadCSV(rows, filename) {

    const csv =
      rows
        .map(row =>
          row
            .map(value =>
              `"${String(value ?? "")
                .replaceAll('"', '""')}"`
            )
            .join(",")
        )
        .join("\n");


    const blob =
      new Blob(
        ["\uFEFF" + csv],
        {
          type: "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");

    a.href = url;

    a.download = filename;

    a.click();

    URL.revokeObjectURL(url);

  }


  init();

</script>

</body>
</html>
