<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>管理員後台｜校園訂購系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f6f6f4;
      color: #222;
    }

    header {
      height: 72px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .page-title {
      margin-bottom: 28px;
    }

    .page-title h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .page-title p {
      margin: 0;
      color: #777;
      font-size: 15px;
    }

    /* 統計卡片 */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 22px;
    }

    .stat-title {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 700;
    }

    /* 區塊 */

    .section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 24px;
      margin-bottom: 28px;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: 21px;
    }

    .section-description {
      margin: -8px 0 20px;
      color: #777;
      font-size: 14px;
    }

    /* 班級狀態 */

    .class-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .class-card {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 18px;
      background: #fafafa;
    }

    .class-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .class-info {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
    }

    .paid {
      color: #267a45;
      font-weight: 600;
    }

    .unpaid {
      color: #a33a3a;
      font-weight: 600;
    }

    /* 篩選區 */

    .filter-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-area label {
      font-size: 14px;
      font-weight: 600;
    }

    .product-select {
      min-width: 240px;
      height: 42px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      padding: 0 12px;
      font-size: 15px;
    }

    .export-button {
      height: 42px;
      padding: 0 18px;
      border: 1px solid #333;
      background: #333;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .export-button:hover {
      background: #111;
    }

    /* 表格 */

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #ddd;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
      background: #fff;
    }

    th,
    td {
      padding: 13px 12px;
      border-bottom: 1px solid #e5e5e5;
      text-align: center;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #f3f3f3;
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .empty-message {
      padding: 30px;
      text-align: center;
      color: #888;
      border: 1px solid #ddd;
      background: #fafafa;
    }

    /* 管理功能 */

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .feature-card {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 20px;
      background: #fafafa;
    }

    .feature-card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .feature-card p {
      margin: 0;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .class-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .feature-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 0 16px;
        height: auto;
        min-height: 72px;
        align-items: flex-start;
        padding-top: 18px;
        padding-bottom: 18px;
        flex-direction: column;
        gap: 14px;
      }

      nav {
        gap: 14px;
        flex-wrap: wrap;
      }

      main {
        padding: 28px 16px 60px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .class-grid,
      .feature-grid {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 18px;
      }

      .page-title h1 {
        font-size: 26px;
      }

      .filter-area {
        align-items: stretch;
        flex-direction: column;
      }

      .product-select,
      .export-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">校園訂購系統｜管理員</div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="product.html">商品</a>
    <a href="class-rep.html">班代後台</a>
    <a href="orders.html">學生訂單</a>
  </nav>
</header>


<main>

  <!-- 頁面標題 -->

  <div class="page-title">
    <h1>管理員後台</h1>
    <p>查看全校訂單、收款狀態與訂貨統計</p>
  </div>


  <!-- 總體統計 -->

  <section class="stats-grid">

    <div class="stat-card">
      <div class="stat-title">有效訂單</div>
      <div class="stat-number" id="validOrders">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">未收款</div>
      <div class="stat-number" id="unpaidOrders">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">已收款</div>
      <div class="stat-number" id="paidOrders">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">已取消</div>
      <div class="stat-number" id="cancelledOrders">0</div>
    </div>

  </section>


  <!-- 班級收款狀態 -->

  <section class="section">

    <h2 class="section-title">班級收款狀態</h2>

    <p class="section-description">
      目前訂單依學年度與班級整理。
    </p>

    <div id="classStatusContainer"></div>

  </section>


  <!-- 訂貨統計 -->

  <section class="section">

    <h2 class="section-title">訂貨統計</h2>

    <p class="section-description">
      選擇商品後，可以查看各班級的訂購數量。
    </p>

    <div class="filter-area">

      <label for="productSelect">
        選擇商品
      </label>

      <select
        id="productSelect"
        class="product-select"
        onchange="showProductStatistics()"
      >
        <option value="">請選擇商品</option>
      </select>

      <button
        class="export-button"
        onclick="exportCSV()"
      >
        匯出訂貨統計
      </button>

      <button
        class="export-button"
        onclick="exportDetailedOrdersCSV()"
      >
        匯出詳細訂單
      </button>

    </div>

    <div id="statisticsContainer">

      <div class="empty-message">
        請先選擇商品
      </div>

    </div>

  </section>


  <!-- 其他管理功能 -->

  <section class="section">

    <h2 class="section-title">系統管理</h2>

    <div class="feature-grid">

      <div class="feature-card">
        <h3>商品管理</h3>
        <p>
          未來可以在這裡新增、修改或下架校園商品。
        </p>
      </div>

      <div class="feature-card">
        <h3>公告管理</h3>
        <p>
          未來可以管理首頁公告與重要通知。
        </p>
      </div>

      <div class="feature-card">
        <h3>網站設定</h3>
        <p>
          未來可以設定網站背景、主題與其他介面內容。
        </p>
      </div>

    </div>

  </section>

</main>


<script>

  /* =========================================
     讀取訂單資料
  ========================================= */

  let allOrders =
    JSON.parse(localStorage.getItem("schoolOrders")) || [];


  /* =========================================
     取得有效訂單
  ========================================= */

  function getActiveOrders() {

    return allOrders.filter(function(order) {

      return order.status !== "已取消";

    });

  }


  /* =========================================
     更新首頁統計
  ========================================= */

  function updateStatistics() {

    const activeOrders = getActiveOrders();

    const cancelledOrders =
      allOrders.filter(function(order) {

        return order.status === "已取消";

      });


    const unpaidOrders =
      activeOrders.filter(function(order) {

        return order.paymentStatus !== "paid";

      });


    const paidOrders =
      activeOrders.filter(function(order) {

        return order.paymentStatus === "paid";

      });


    document.getElementById("validOrders").textContent =
      activeOrders.length;

    document.getElementById("unpaidOrders").textContent =
      unpaidOrders.length;

    document.getElementById("paidOrders").textContent =
      paidOrders.length;

    document.getElementById("cancelledOrders").textContent =
      cancelledOrders.length;

  }


  /* =========================================
     建立班級統計
  ========================================= */

  function showClassStatus() {

    const container =
      document.getElementById("classStatusContainer");

    const activeOrders = getActiveOrders();


    if (activeOrders.length === 0) {

      container.innerHTML =
        '<div class="empty-message">目前沒有有效訂單</div>';

      return;
    }


    const classMap = {};


    activeOrders.forEach(function(order) {

      const key =
        (order.academicYear || "未知") +
        "-" +
        (order.className || "未知");

      if (!classMap[key]) {

        classMap[key] = {

          academicYear:
            order.academicYear || "未知",

          className:
            order.className || "未知",

          orders: [],

          students: {}

        };

      }


      classMap[key].orders.push(order);


      if (order.seatNumber !== undefined &&
          order.seatNumber !== null &&
          order.seatNumber !== "") {

        classMap[key].students[
          String(order.seatNumber)
        ] = true;

      }

    });


    const classes =
      Object.values(classMap);


    classes.sort(function(a, b) {

      const yearCompare =
        String(a.academicYear)
          .localeCompare(
            String(b.academicYear),
            "zh-Hant"
          );

      if (yearCompare !== 0) {
        return yearCompare;
      }

      return String(a.className)
        .localeCompare(
          String(b.className),
          "zh-Hant"
        );

    });


    let html =
      '<div class="class-grid">';


    classes.forEach(function(classData) {

      const unpaid =
        classData.orders.filter(function(order) {

          return order.paymentStatus !== "paid";

        }).length;


      const paid =
        classData.orders.filter(function(order) {

          return order.paymentStatus === "paid";

        }).length;


      let statusText;
      let statusClass;


      if (unpaid === 0) {

        statusText = "已收齊";
        statusClass = "paid";

      } else {

        statusText =
          "尚有 " + unpaid + " 筆未收款";

        statusClass = "unpaid";

      }


      html += `
        <div class="class-card">

          <div class="class-name">
            ${escapeHTML(classData.academicYear)}
            學年度
            ${escapeHTML(classData.className)}
          </div>

          <div class="class-info">

            訂單數量：
            ${classData.orders.length}
            筆
            <br>

            訂購學生：
            ${Object.keys(classData.students).length}
            人
            <br>

            已收款：
            ${paid}
            筆
            <br>

            未收款：
            ${unpaid}
            筆
            <br>

            <span class="${statusClass}">
              ${statusText}
            </span>

          </div>

        </div>
      `;

    });


    html += "</div>";

    container.innerHTML = html;

  }


  /* =========================================
     商品選單
  ========================================= */

  function loadProductSelect() {

    const select =
      document.getElementById("productSelect");


    const activeOrders =
      getActiveOrders();


    const productMap = {};


    activeOrders.forEach(function(order) {

      if (!order.name) {
        return;
      }

      productMap[order.name] = {

        name: order.name,

        category:
          order.category || "",

        hasSize:
          !!order.size

      };

    });


    const products =
      Object.values(productMap);


    products.sort(function(a, b) {

      return a.name.localeCompare(
        b.name,
        "zh-Hant"
      );

    });


    products.forEach(function(product) {

      const option =
        document.createElement("option");

      option.value = product.name;

      option.textContent = product.name;

      select.appendChild(option);

    });

  }


  /* =========================================
     顯示商品訂貨統計
  ========================================= */

  function showProductStatistics() {

    const select =
      document.getElementById("productSelect");

    const productName =
      select.value;


    const container =
      document.getElementById("statisticsContainer");


    if (!productName) {

      container.innerHTML =
        '<div class="empty-message">請先選擇商品</div>';

      return;

    }


    const activeOrders =
      getActiveOrders().filter(function(order) {

        return order.name === productName;

      });


    if (activeOrders.length === 0) {

      container.innerHTML =
        '<div class="empty-message">目前沒有這個商品的訂單</div>';

      return;

    }


    /*
      判斷是不是有尺寸的商品
    */

    const hasSize =
      activeOrders.some(function(order) {

        return (
          order.size === "S" ||
          order.size === "M" ||
          order.size === "L" ||
          order.size === "XL"
        );

      });


    /*
      依照學年度 + 班級分組
    */

    const classMap = {};


    activeOrders.forEach(function(order) {

      const academicYear =
        order.academicYear || "未知";

      const className =
        order.className || "未知";

      const key =
        academicYear + "-" + className;


      if (!classMap[key]) {

        classMap[key] = {

          academicYear:
            academicYear,

          className:
            className,

          S: 0,
          M: 0,
          L: 0,
          XL: 0,

          quantity: 0

        };

      }


      const quantity =
        Number(order.quantity) || 0;


      if (hasSize) {

        if (order.size === "S") {
          classMap[key].S += quantity;
        }

        if (order.size === "M") {
          classMap[key].M += quantity;
        }

        if (order.size === "L") {
          classMap[key].L += quantity;
        }

        if (order.size === "XL") {
          classMap[key].XL += quantity;
        }

      } else {

        classMap[key].quantity += quantity;

      }

    });


    const classes =
      Object.values(classMap);


    classes.sort(function(a, b) {

      const yearCompare =
        String(a.academicYear)
          .localeCompare(
            String(b.academicYear),
            "zh-Hant"
          );

      if (yearCompare !== 0) {
        return yearCompare;
      }

      return String(a.className)
        .localeCompare(
          String(b.className),
          "zh-Hant"
        );

    });


    let schoolTotal = 0;


    let html =
      '<div class="table-wrapper">';

    html += "<table>";

    html += "<thead>";

    html += "<tr>";

    html += "<th>學年度</th>";

    html += "<th>班級</th>";


    if (hasSize) {

      html += "<th>S</th>";
      html += "<th>M</th>";
      html += "<th>L</th>";
      html += "<th>XL</th>";

    } else {

      html += "<th>數量</th>";

    }


    html += "<th>班級總計</th>";

    html += "</tr>";

    html += "</thead>";

    html += "<tbody>";


    classes.forEach(function(classData) {

      let classTotal = 0;


      if (hasSize) {

        classTotal =
          classData.S +
          classData.M +
          classData.L +
          classData.XL;

      } else {

        classTotal =
          classData.quantity;

      }


      schoolTotal += classTotal;


      html += "<tr>";

      html +=
        "<td>" +
        escapeHTML(classData.academicYear) +
        "</td>";

      html +=
        "<td>" +
        escapeHTML(classData.className) +
        "</td>";


      if (hasSize) {

        html +=
          "<td>" + classData.S + "</td>";

        html +=
          "<td>" + classData.M + "</td>";

        html +=
          "<td>" + classData.L + "</td>";

        html +=
          "<td>" + classData.XL + "</td>";

      } else {

        html +=
          "<td>" +
          classData.quantity +
          "</td>";

      }


      html +=
        "<td><strong>" +
        classTotal +
        "</strong></td>";

      html += "</tr>";

    });


    /*
      全校總計
    */

    html += "<tr>";

    html +=
      '<td colspan="2"><strong>全校總計</strong></td>';


    if (hasSize) {

      let totalS = 0;
      let totalM = 0;
      let totalL = 0;
      let totalXL = 0;


      classes.forEach(function(classData) {

        totalS += classData.S;
        totalM += classData.M;
        totalL += classData.L;
        totalXL += classData.XL;

      });


      html +=
        "<td><strong>" +
        totalS +
        "</strong></td>";

      html +=
        "<td><strong>" +
        totalM +
        "</strong></td>";

      html +=
        "<td><strong>" +
        totalL +
        "</strong></td>";

      html +=
        "<td><strong>" +
        totalXL +
        "</strong></td>";

    } else {

      html +=
        "<td><strong>" +
        schoolTotal +
        "</strong></td>";

    }


    html +=
      "<td><strong>" +
      schoolTotal +
      "</strong></td>";

    html += "</tr>";

    html += "</tbody>";

    html += "</table>";

    html += "</div>";


    container.innerHTML = html;

  }


  /* =========================================
     匯出訂貨統計 CSV
  ========================================= */

  function exportCSV() {

    const select =
      document.getElementById("productSelect");

    const productName =
      select.value;


    if (!productName) {

      alert("請先選擇商品");

      return;

    }


    const activeOrders =
      getActiveOrders().filter(function(order) {

        return order.name === productName;

      });


    if (activeOrders.length === 0) {

      alert("目前沒有這個商品的訂單");

      return;

    }


    const hasSize =
      activeOrders.some(function(order) {

        return (
          order.size === "S" ||
          order.size === "M" ||
          order.size === "L" ||
          order.size === "XL"
        );

      });


    const classMap = {};


    activeOrders.forEach(function(order) {

      const academicYear =
        order.academicYear || "未知";

      const className =
        order.className || "未知";

      const key =
        academicYear + "-" + className;


      if (!classMap[key]) {

        classMap[key] = {

          academicYear,
          className,

          S: 0,
          M: 0,
          L: 0,
          XL: 0,

          quantity: 0

        };

      }


      const quantity =
        Number(order.quantity) || 0;


      if (hasSize) {

        if (order.size === "S") {
          classMap[key].S += quantity;
        }

        if (order.size === "M") {
          classMap[key].M += quantity;
        }

        if (order.size === "L") {
          classMap[key].L += quantity;
        }

        if (order.size === "XL") {
          classMap[key].XL += quantity;
        }

      } else {

        classMap[key].quantity += quantity;

      }

    });


    const classes =
      Object.values(classMap);


    let csv = "";


    if (hasSize) {

      csv =
        "學年度,班級,S,M,L,XL,班級總計\n";


      classes.forEach(function(classData) {

        const total =
          classData.S +
          classData.M +
          classData.L +
          classData.XL;


        csv +=
          csvEscape(classData.academicYear) + "," +
          csvEscape(classData.className) + "," +
          csvEscape(classData.S) + "," +
          csvEscape(classData.M) + "," +
          csvEscape(classData.L) + "," +
          csvEscape(classData.XL) + "," +
          csvEscape(total) +
          "\n";

      });

    } else {

      csv =
        "學年度,班級,數量\n";


      classes.forEach(function(classData) {

        csv +=
          csvEscape(classData.academicYear) + "," +
          csvEscape(classData.className) + "," +
          csvEscape(classData.quantity) +
          "\n";

      });

    }


    downloadCSV(
      csv,
      "訂貨統計_" +
      safeFileName(productName) +
      "_" +
      getTodayString() +
      ".csv"
    );

  }


  /* =========================================
     匯出詳細訂單 CSV
  ========================================= */

  function exportDetailedOrdersCSV() {

    /*
      重新讀取一次資料，
      確保不是使用舊資料。
    */

    const orders =
      JSON.parse(
        localStorage.getItem("schoolOrders")
      ) || [];


    const activeOrders =
      orders.filter(function(order) {

        return order.status !== "已取消";

      });


    if (activeOrders.length === 0) {

      alert("目前沒有可以匯出的訂單");

      return;

    }


    let csv =
      "訂單編號,訂單時間,學年度,年級,班級,座號,商品,類別,尺寸,數量,單價,總金額,收款狀態,訂單狀態\n";


    activeOrders.forEach(function(order) {

      const paymentText =
        order.paymentStatus === "paid"
          ? "已收款"
          : "未收款";


      const orderStatus =
        order.status || "訂單成立";


      const row = [

        order.orderNumber || "",

        order.orderTime || "",

        order.academicYear || "",

        order.grade || "",

        order.className || "",

        order.seatNumber || "",

        order.name || "",

        order.category || "",

        order.size || "無尺寸",

        order.quantity || 0,

        order.price || 0,

        order.total || 0,

        paymentText,

        orderStatus

      ];


      csv +=
        row
          .map(csvEscape)
          .join(",") +
        "\n";

    });


    downloadCSV(
      csv,
      "詳細訂單_" +
      getTodayString() +
      ".csv"
    );

  }


  /* =========================================
     CSV 下載
  ========================================= */

  function downloadCSV(csv, fileName) {

    const BOM = "\uFEFF";


    const blob =
      new Blob(
        [BOM + csv],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download = fileName;

    link.style.display = "none";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    setTimeout(function() {

      URL.revokeObjectURL(url);

    }, 1000);

  }


  /* =========================================
     CSV 特殊字元處理
  ========================================= */

  function csvEscape(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    const text =
      String(value);


    if (
      text.includes(",") ||
      text.includes('"') ||
      text.includes("\n") ||
      text.includes("\r")
    ) {

      return (
        '"' +
        text.replace(/"/g, '""') +
        '"'
      );

    }


    return text;

  }


  /* =========================================
     防止 HTML 文字造成問題
  ========================================= */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     檔名處理
  ========================================= */

  function safeFileName(value) {

    return String(value)
      .replace(/[\\/:*?"<>|]/g, "_")
      .replace(/\s+/g, "_");

  }


  /* =========================================
     今天日期
  ========================================= */

  function getTodayString() {

    const now =
      new Date();


    const year =
      now.getFullYear();


    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");


    const day =
      String(
        now.getDate()
      ).padStart(2, "0");


    return (
      year +
      "-" +
      month +
      "-" +
      day
    );

  }


  /* =========================================
     頁面初始化
  ========================================= */

  function initAdminPage() {

    /*
      每次重新進入頁面，
      都重新讀取最新訂單。
    */

    allOrders =
      JSON.parse(
        localStorage.getItem("schoolOrders")
      ) || [];


    updateStatistics();

    showClassStatus();

    loadProductSelect();

  }


  initAdminPage();

</script>
