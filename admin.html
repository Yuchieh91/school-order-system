<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>管理員後台｜校園訂購系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #222;
    }

    header {
      height: 72px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .page-title p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 22px;
    }

    .stat-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
    }

    .section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .section-header {
      padding: 20px 22px;
      border-bottom: 1px solid #ddd;
    }

    .section-header h2 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .section-header p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    .section-content {
      padding: 22px;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .class-card {
      border: 1px solid #ddd;
      padding: 18px;
      background: #fafafa;
    }

    .class-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .class-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .class-info span:first-child {
      color: #777;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #777;
      border: 1px dashed #ccc;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .feature-card {
      border: 1px solid #ddd;
      padding: 22px;
      background: #fafafa;
    }

    .feature-card h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .feature-card p {
      margin: 0 0 18px;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .feature-button {
      display: inline-block;
      padding: 9px 14px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
    }

    .feature-button:hover {
      opacity: 0.85;
    }

    @media (max-width: 800px) {
      header {
        padding: 0 18px;
      }

      nav {
        gap: 12px;
      }

      nav a:nth-child(1),
      nav a:nth-child(2),
      nav a:nth-child(3) {
        display: none;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .class-grid,
      .feature-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 28px 16px 50px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 16px;
      }

      .stat-number {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">校園訂購系統｜管理後台</div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="product.html">商品</a>
    <a href="class-rep.html">班代端</a>
    <a href="orders.html">學生訂單</a>
  </nav>
</header>

<div class="container">

  <div class="page-title">
    <h1>管理員後台</h1>
    <p>查看目前訂購狀況與班級收款進度</p>
  </div>

  <!-- 統計 -->
  <div class="stats">

    <div class="stat-card">
      <div class="stat-title">有效訂單</div>
      <div class="stat-number" id="totalOrders">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">未收款</div>
      <div class="stat-number" id="unpaidOrders">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">已收款</div>
      <div class="stat-number" id="paidOrders">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">已取消</div>
      <div class="stat-number" id="cancelledOrders">0</div>
    </div>

  </div>


  <!-- 班級狀況 -->
  <div class="section">

    <div class="section-header">
      <h2>班級訂購狀況</h2>
      <p>目前系統中的各班訂單統計</p>
    </div>

    <div class="section-content">

      <div id="classList" class="class-grid"></div>

    </div>

  </div>


  <!-- 管理功能 -->
  <div class="section">

    <div class="section-header">
      <h2>管理功能</h2>
      <p>之後會逐步加入完整的管理工具</p>
    </div>

    <div class="section-content">

      <div class="feature-grid">

        <div class="feature-card">
          <h3>📦 商品管理</h3>
          <p>
            新增商品、修改價格、尺寸與商品資訊。
          </p>
          <a href="#" class="feature-button">
            即將開放
          </a>
        </div>

        <div class="feature-card">
          <h3>📊 訂貨統計</h3>
          <p>
            依照「班級 × 商品 × 尺寸」統計訂購數量。
          </p>
          <a href="#" class="feature-button">
            即將開放
          </a>
        </div>

        <div class="feature-card">
          <h3>📢 公告管理</h3>
          <p>
            修改首頁公告與目前的訂購活動資訊。
          </p>
          <a href="#" class="feature-button">
            即將開放
          </a>
        </div>

      </div>

    </div>

  </div>

</div>


<script>

  // 取得目前所有訂單
  const allOrders =
    JSON.parse(localStorage.getItem("schoolOrders")) || [];


  // 有效訂單
  const activeOrders = allOrders.filter(order => {
    return order.status !== "已取消";
  });


  // 已取消訂單
  const cancelledOrders = allOrders.filter(order => {
    return order.status === "已取消";
  });


  // 未收款
  const unpaidOrders = activeOrders.filter(order => {
    return order.paymentStatus !== "paid";
  });


  // 已收款
  const paidOrders = activeOrders.filter(order => {
    return order.paymentStatus === "paid";
  });


  // 顯示統計
  document.getElementById("totalOrders").textContent =
    activeOrders.length;

  document.getElementById("unpaidOrders").textContent =
    unpaidOrders.length;

  document.getElementById("paidOrders").textContent =
    paidOrders.length;

  document.getElementById("cancelledOrders").textContent =
    cancelledOrders.length;


  // -------------------------
  // 班級統計
  // -------------------------

  const classList = document.getElementById("classList");

  // 只統計有效訂單
  const classData = {};

  activeOrders.forEach(order => {

    const academicYear =
      order.academicYear || "未知";

    const className =
      order.className || "未設定";

    const classKey =
      academicYear + "-" + className;


    if (!classData[classKey]) {

      classData[classKey] = {
        academicYear: academicYear,
        className: className,
        students: new Set(),
        products: 0,
        total: 0,
        unpaid: 0
      };

    }


    // 計算不同學生數
    if (order.seatNumber) {
      classData[classKey].students.add(
        order.seatNumber
      );
    }


    // 商品總數
    classData[classKey].products +=
      Number(order.quantity) || 0;


    // 金額
    classData[classKey].total +=
      Number(order.total) || 0;


    // 未收款
    if (order.paymentStatus !== "paid") {
      classData[classKey].unpaid++;
    }

  });


  const classes =
    Object.values(classData);


  if (classes.length === 0) {

    classList.innerHTML = `
      <div class="empty">
        目前還沒有訂單資料
      </div>
    `;

  } else {

    classes.sort((a, b) => {

      return (
        a.academicYear + a.className
      ).localeCompare(
        b.academicYear + b.className
      );

    });


    classes.forEach(classInfo => {

      const card =
        document.createElement("div");

      card.className = "class-card";


      card.innerHTML = `

        <div class="class-name">
          ${classInfo.academicYear} ${classInfo.className}
        </div>

        <div class="class-info">
          <span>訂購學生</span>
          <strong>${classInfo.students.size} 人</strong>
        </div>

        <div class="class-info">
          <span>商品數量</span>
          <strong>${classInfo.products} 件</strong>
        </div>

        <div class="class-info">
          <span>訂單金額</span>
          <strong>NT$ ${classInfo.total.toLocaleString()}</strong>
        </div>

        <div class="class-info">
          <span>未收款</span>
          <strong>${classInfo.unpaid} 筆</strong>
        </div>

      `;


      classList.appendChild(card);

    });

  }

</script>

</body>
</html>
