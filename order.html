<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的訂單｜校園訂購系統</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #222;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #ddd;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 40px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #333;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .deadline {
      background: white;
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 5px;
      font-size: 14px;
    }

    .order-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;

      padding: 22px;
      margin-bottom: 18px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
      margin-bottom: 15px;
    }

    .order-number {
      font-weight: bold;
    }

    .status {
      font-size: 14px;
      padding: 5px 9px;
      border: 1px solid #bbb;
      border-radius: 4px;
    }

    .order-info {
      line-height: 1.9;
      font-size: 15px;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }

    .cancel-button {
      margin-top: 18px;

      padding: 10px 18px;

      background: white;
      color: #b00000;

      border: 1px solid #b00000;
      border-radius: 4px;

      cursor: pointer;
    }

    .cancel-button:hover {
      background: #f8eeee;
    }

    .cancelled {
      background: #f1f1f1;
      color: #777;
    }

    .cancelled .status {
      color: #777;
    }

    .empty {
      background: white;
      border: 1px solid #ddd;
      padding: 40px;
      text-align: center;
      border-radius: 5px;
    }

    .product-button {
      display: inline-block;
      margin-top: 20px;

      background: #222;
      color: white;

      padding: 11px 20px;

      text-decoration: none;
      border-radius: 4px;
    }

    .clear-button {
      margin-top: 20px;

      padding: 9px 15px;

      background: white;
      border: 1px solid #bbb;

      cursor: pointer;
      border-radius: 4px;
    }

    @media (max-width: 700px) {

      header {
        padding: 0 15px;
      }

      nav a {
        margin-left: 9px;
        font-size: 13px;
      }

      .order-header {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
      }

    }

  </style>
</head>


<body>

<header>

  <div class="logo">
    校園訂購系統
  </div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="product.html">商品</a>
    <a href="orders.html">我的訂單</a>
    <a href="student-profile.html">我的資料</a>
  </nav>

</header>


<div class="container">

  <h1>我的訂單</h1>

  <div class="deadline">

    <strong>本次繳費截止時間：</strong>

    2026/10/15 23:59

    <br>

    在繳費期限以前可以取消訂單。

  </div>


  <div id="ordersContainer"></div>


  <button
    class="clear-button"
    onclick="clearTestOrders()"
  >
    清除測試訂單
  </button>

</div>


<script>

  /*
   * =====================================
   * 設定繳費截止時間
   * =====================================
   *
   * 之後做管理員後台時，
   * 這裡會改成從資料庫取得。
   *
   */

  const paymentDeadline =
    new Date("2026-10-15T23:59:00");


  /*
   * =====================================
   * 取得訂單
   * =====================================
   */

  let orders =
    JSON.parse(
      localStorage.getItem("schoolOrders")
    ) || [];


  /*
   * =====================================
   * 顯示訂單
   * =====================================
   */

  function displayOrders() {

    const container =
      document.getElementById("ordersContainer");


    if (orders.length === 0) {

      container.innerHTML = `

        <div class="empty">

          <p>目前還沒有訂單。</p>

          <a
            href="product.html"
            class="product-button"
          >
            前往商品頁
          </a>

        </div>

      `;

      return;
    }


    container.innerHTML = "";


    orders.forEach(function(order, index) {

      const card =
        document.createElement("div");

      card.className = "order-card";


      /*
       * 如果已取消
       */

      if (order.status === "已取消") {

        card.classList.add("cancelled");

      }


      /*
       * 收款狀態
       */

      let paymentText = "未收款";

      if (order.paymentStatus === "paid") {

        paymentText = "已收款";

      }


      /*
       * 尺寸
       */

      let sizeText = "";

      if (order.size) {

        sizeText =
          `<div>尺寸：${order.size}</div>`;

      }


      /*
       * 是否可以取消
       */

      const now = new Date();

      const beforeDeadline =
        now < paymentDeadline;


      const canCancel =
        order.status !== "已取消" &&
        beforeDeadline;


      /*
       * 取消按鈕
       */

      let cancelButton = "";


      if (canCancel) {

        cancelButton = `

          <button
            class="cancel-button"
            onclick="cancelOrder(${index})"
          >
            取消訂單
          </button>

        `;

      }


      /*
       * 如果已取消
       */

      if (order.status === "已取消") {

        cancelButton = "";

      }


      card.innerHTML = `

        <div class="order-header">

          <div class="order-number">

            訂單編號：
            ${order.orderNumber}

          </div>

          <div class="status">

            ${order.status}

          </div>

        </div>


        <div class="order-info">

          <div>
            下單時間：
            ${order.orderTime}
          </div>

          <div>
            學年度：
            ${order.academicYear}
          </div>

          <div>
            班級：
            ${order.className}
          </div>

          <div>
            座號：
            ${order.seatNumber}
          </div>

          <br>


          <div>
            商品：
            ${order.name}
          </div>

          <div>
            類別：
            ${order.category}
          </div>

          ${sizeText}

          <div>
            單價：
            NT$ ${order.price}
          </div>

          <div>
            數量：
            ${order.quantity}
          </div>

          <div>
            收款狀態：
            ${paymentText}
          </div>


          <div class="total">

            總金額：
            NT$ ${order.total}

          </div>

        </div>


        ${cancelButton}

      `;


      container.appendChild(card);

    });

  }


  /*
   * =====================================
   * 取消訂單
   * =====================================
   */

  function cancelOrder(index) {

    const now = new Date();


    /*
     * 再次確認是否超過截止時間
     */

    if (now >= paymentDeadline) {

      alert(
        "已超過繳費截止時間，無法取消訂單。"
      );

      return;
    }


    /*
     * 防止重複取消
     */

    if (orders[index].status === "已取消") {

      return;

    }


    /*
     * 確認
     */

    const confirmCancel =
      confirm(
        "確定要取消這筆訂單嗎？\n\n" +
        "訂單編號：" +
        orders[index].orderNumber
      );


    if (!confirmCancel) {

      return;

    }


    /*
     * 不刪除訂單
     *
     * 只把狀態改成「已取消」
     */

    orders[index].status = "已取消";


    /*
     * 儲存
     */

    localStorage.setItem(
      "schoolOrders",
      JSON.stringify(orders)
    );


    alert("訂單已取消。");


    /*
     * 重新顯示
     */

    displayOrders();

  }


  /*
   * =====================================
   * 清除測試訂單
   * =====================================
   */

  function clearTestOrders() {

    const confirmClear =
      confirm(
        "確定要清除所有測試訂單嗎？"
      );


    if (!confirmClear) {

      return;

    }


    localStorage.removeItem(
      "schoolOrders"
    );


    orders = [];


    displayOrders();

  }


  /*
   * =====================================
   * 開始顯示
   * =====================================
   */

  displayOrders();

</script>

</body>
</html>
