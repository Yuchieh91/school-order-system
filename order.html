<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的訂單｜校園訂購平台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #202020;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #e5e5e5;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-size: 15px;
    }

    nav a:hover {
      color: #777;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 25px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .page-title p {
      margin: 0;
      color: #777;
    }

    .empty {
      background: white;
      border: 1px solid #e3e3e3;
      border-radius: 5px;

      padding: 60px 25px;
      text-align: center;

      color: #777;
    }

    .empty a {
      display: inline-block;
      margin-top: 20px;

      padding: 10px 18px;

      background: #202020;
      color: white;

      text-decoration: none;
      border-radius: 3px;
    }

    .order-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .order-item {
      background: white;
      border: 1px solid #e3e3e3;
      border-radius: 5px;
      padding: 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .order-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .order-info {
      color: #777;
      font-size: 14px;
      line-height: 1.8;
    }

    .order-price {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .clear-button {
      margin-top: 25px;

      padding: 9px 15px;

      background: white;
      color: #555;

      border: 1px solid #ccc;
      border-radius: 3px;

      cursor: pointer;
    }

    .clear-button:hover {
      background: #f2f2f2;
    }

    @media (max-width: 600px) {

      header {
        padding: 0 20px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 13px;
      }

      .page {
        padding: 35px 18px;
      }

      .order-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .order-price {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      校園訂購平台
    </div>

    <nav>
      <a href="index.html">首頁</a>
      <a href="product.html">商品</a>
      <a href="orders.html">我的訂單</a>
      <a href="#">登入</a>
    </nav>

  </header>


  <main class="page">

    <div class="page-title">

      <h1>我的訂單</h1>

      <p>
        查看你目前加入的商品
      </p>

    </div>


    <div id="orderContainer"></div>


    <button
      class="clear-button"
      onclick="clearOrders()"
      id="clearButton"
    >
      清除測試訂單
    </button>

  </main>


  <script>

    /*
     * 從瀏覽器取得之前儲存的訂單
     */

    let orders =
      JSON.parse(
        localStorage.getItem("schoolOrders")
      ) || [];


    /*
     * 顯示訂單
     */

    function showOrders() {

      const container =
        document.getElementById("orderContainer");

      const clearButton =
        document.getElementById("clearButton");


      /*
       * 如果沒有訂單
       */

      if (orders.length === 0) {

        container.innerHTML = `
          <div class="empty">

            <div>
              目前還沒有訂單
            </div>

            <a href="product.html">
              去看看商品
            </a>

          </div>
        `;

        clearButton.style.display = "none";

        return;
      }


      /*
       * 有訂單
       */

      clearButton.style.display = "inline-block";


      let html = `
        <div class="order-list">
      `;


      orders.forEach(function(order) {

        html += `

          <div class="order-item">

            <div>

              <div class="order-name">
                ${order.name}
              </div>

              <div class="order-info">

                分類：${order.category}
                <br>

                數量：${order.quantity}

                ${
                  order.size
                    ? `<br>尺寸：${order.size}`
                    : ""
                }

              </div>

            </div>


            <div class="order-price">

              NT$${order.total}

            </div>

          </div>

        `;

      });


      html += `
        </div>
      `;


      container.innerHTML = html;

    }


    /*
     * 清除測試訂單
     */

    function clearOrders() {

      localStorage.removeItem("schoolOrders");

      orders = [];

      showOrders();

    }


    /*
     * 第一次載入頁面
     */

    showOrders();

  </script>

</body>
</html>
