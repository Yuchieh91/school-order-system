<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的訂單｜校園訂購系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #222;
    }

    /* ===== Header ===== */

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #ddd;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 40px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-size: 15px;
    }

    nav a:hover {
      color: #777;
    }

    /* ===== Main ===== */

    main {
      max-width: 1000px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .page-title p {
      margin: 0;
      color: #777;
    }

    /* ===== Order Card ===== */

    .order-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;

      padding: 24px;
      margin-bottom: 20px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      padding-bottom: 18px;
      border-bottom: 1px solid #eee;
    }

    .order-number {
      font-size: 17px;
      font-weight: bold;
    }

    .order-time {
      margin-top: 6px;
      font-size: 13px;
      color: #888;
    }

    .status {
      padding: 7px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    /* ===== Product ===== */

    .product-info {
      padding: 20px 0;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .product-detail {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;

      color: #666;
      font-size: 14px;
    }

    /* ===== Total ===== */

    .order-total {
      border-top: 1px solid #eee;
      padding-top: 18px;

      text-align: right;
      font-size: 18px;
      font-weight: bold;
    }

    /* ===== Empty ===== */

    .empty {
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;

      padding: 60px 20px;
      text-align: center;
    }

    .empty p {
      color: #777;
      margin-bottom: 25px;
    }

    .product-button {
      display: inline-block;

      padding: 11px 20px;

      background: #222;
      color: white;

      text-decoration: none;
      border-radius: 4px;
    }

    /* ===== Test Button ===== */

    .clear-button {
      margin-top: 20px;

      padding: 10px 16px;

      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;

      cursor: pointer;
    }

    .clear-button:hover {
      background: #f0f0f0;
    }

    /* ===== Mobile ===== */

    @media (max-width: 700px) {

      header {
        padding: 0 20px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 13px;
      }

      main {
        margin-top: 35px;
      }

      .order-header {
        flex-direction: column;
        gap: 12px;
      }

      .order-total {
        text-align: left;
      }
    }
  </style>
</head>


<body>

  <!-- ===== Header ===== -->

  <header>

    <div class="logo">
      校園訂購系統
    </div>

    <nav>
      <a href="index.html">首頁</a>
      <a href="product.html">商品</a>
      <a href="orders.html">我的訂單</a>
      <a href="#">登入</a>
    </nav>

  </header>


  <!-- ===== Main ===== -->

  <main>

    <div class="page-title">
      <h1>我的訂單</h1>
      <p>查看你的訂購紀錄與目前訂單狀態</p>
    </div>


    <div id="ordersContainer"></div>


    <!-- 測試用 -->

    <button
      class="clear-button"
      onclick="clearOrders()"
    >
      清除測試訂單
    </button>

  </main>


  <script>

    // 從瀏覽器取得訂單
    let orders =
      JSON.parse(
        localStorage.getItem("schoolOrders")
      ) || [];


    const container =
      document.getElementById(
        "ordersContainer"
      );


    // 沒有訂單
    if (orders.length === 0) {

      container.innerHTML = `

        <div class="empty">

          <p>
            目前還沒有訂單
          </p>

          <a
            href="product.html"
            class="product-button"
          >
            前往商品頁
          </a>

        </div>

      `;

    }


    // 有訂單
    else {

      orders.forEach(function(order) {

        container.innerHTML += `

          <div class="order-card">

            <div class="order-header">

              <div>

                <div class="order-number">
                  訂單編號：${order.orderNumber || "測試訂單"}
                </div>

                <div class="order-time">
                  下單時間：
                  ${order.orderTime || "尚未記錄"}
                </div>

              </div>


              <div class="status">
                ${order.status || "等待處理"}
              </div>

            </div>


            <div class="product-info">

              <div class="product-name">
                ${order.name}
              </div>


              <div class="product-detail">

                <span>
                  商品分類：${order.category}
                </span>

                ${
                  order.size
                  ? `<span>尺寸：${order.size}</span>`
                  : ""
                }

                <span>
                  單價：NT$${order.price}
                </span>

                <span>
                  數量：${order.quantity}
                </span>

              </div>

            </div>


            <div class="order-total">

              訂單金額：
              NT$${order.total}

            </div>

          </div>

        `;

      });

    }


    // 清除測試訂單
    function clearOrders() {

      const confirmClear =
        confirm(
          "確定要清除所有測試訂單嗎？"
        );


      if (confirmClear) {

        localStorage.removeItem(
          "schoolOrders"
        );

        location.reload();

      }

    }

  </script>

</body>
</html>
