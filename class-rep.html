<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>班代訂單｜校園訂購系統</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #222;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #ddd;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 40px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-size: 15px;
    }

    main {
      max-width: 1100px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .page-title p {
      margin: 0;
      color: #777;
    }

    .class-info {
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .class-info h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .class-info p {
      margin: 0;
      color: #777;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 22px;
    }

    .stat-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 26px;
      font-weight: bold;
    }

    .order-section {
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: hidden;
    }

    .section-title {
      padding: 22px;
      border-bottom: 1px solid #eee;
      font-size: 20px;
      font-weight: bold;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      background: #fafafa;
      font-weight: bold;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .paid {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 13px;
      background: #f5f5f5;
    }

    .unpaid {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      background: white;
    }

    .payment-button {
      margin-left: 8px;
      padding: 7px 12px;
      background: #222;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .payment-button:hover {
      background: #444;
    }

    .bottom-summary {
      padding: 24px;
      border-top: 1px solid #eee;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .amount {
      font-size: 22px;
      font-weight: bold;
    }

    .collect-button {
      padding: 12px 20px;
      background: #222;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 700px) {

      header {
        padding: 0 20px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 13px;
      }

      main {
        margin-top: 35px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .bottom-summary {
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }

    }

  </style>

</head>


<body>


  <header>

    <div class="logo">
      校園訂購系統
    </div>

    <nav>

      <a href="index.html">
        首頁
      </a>

      <a href="product.html">
        商品
      </a>

      <a href="orders.html">
        我的訂單
      </a>

      <a href="class-rep.html">
        班代
      </a>

    </nav>

  </header>


  <main>


    <div class="page-title">

      <h1>
        班代訂單管理
      </h1>

      <p>
        查看本班學生的訂單與收款狀況
      </p>

    </div>


    <div class="class-info">

      <h2>
        115 年 305 班
      </h2>

      <p>
        班代：測試帳號
      </p>

    </div>


    <div class="stats">

      <div class="stat-card">

        <div class="stat-title">
          訂購人數
        </div>

        <div
          class="stat-number"
          id="studentCount"
        >
          0 人
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          商品總數
        </div>

        <div
          class="stat-number"
          id="productCount"
        >
          0 件
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          應收金額
        </div>

        <div
          class="stat-number"
          id="totalAmount"
        >
          NT$0
        </div>

      </div>

    </div>


    <div class="order-section">

      <div class="section-title">
        本班訂單
      </div>


      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>座號</th>

              <th>訂單編號</th>

              <th>商品</th>

              <th>尺寸</th>

              <th>數量</th>

              <th>金額</th>

              <th>收款狀態</th>

            </tr>

          </thead>


          <tbody id="orderTable">

          </tbody>

        </table>

      </div>


      <div
        class="bottom-summary"
        id="summary"
      >

        <div>

          <div id="paidAmount">
            已收：NT$0
          </div>

          <div id="unpaidAmount">
            未收：NT$0
          </div>

        </div>


        <div
          class="amount"
          id="bottomTotal"
        >
          應收：NT$0
        </div>


        <button
          class="collect-button"
          onclick="finishCollection()"
        >
          標記本班已收齊
        </button>

      </div>

    </div>


  </main>


  <script>

    /*
      目前班代測試帳號
      只查看 115 年 305 班
    */

    const currentAcademicYear = "115";
    const currentClass = "305";


    // 讀取學生訂單

    let allOrders =
      JSON.parse(
        localStorage.getItem("schoolOrders")
      ) || [];


    // 只留下 115 年 305 班

    let classOrders =
      allOrders.filter(function(order) {

        return (
          order.academicYear === currentAcademicYear &&
          order.className === currentClass
        );

      });


    const orderTable =
      document.getElementById("orderTable");


    // 沒有訂單

    if (classOrders.length === 0) {

      orderTable.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="empty"
          >
            目前沒有學生訂單
          </td>

        </tr>

      `;

    }


    // 有訂單

    else {

      classOrders.forEach(function(order, index) {

        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${order.seatNumber || "-"}
          </td>

          <td>
            ${order.orderNumber || "-"}
          </td>

          <td>
            ${order.name}
          </td>

          <td>
            ${order.size || "-"}
          </td>

          <td>
            ${order.quantity}
          </td>

          <td>
            NT$${order.total}
          </td>

          <td>

            <span
              id="payment-${index}"
              class="unpaid"
            >
              未收款
            </span>

            <button
              class="payment-button"
              onclick="markPaid(${index})"
            >
              標記已收
            </button>

          </td>

        `;


        orderTable.appendChild(row);

      });

    }


    // ===== 計算統計資料 =====

    let studentSet =
      new Set();

    let productCount = 0;
    let totalAmount = 0;


    classOrders.forEach(function(order) {

      // 用座號判斷不同學生

      studentSet.add(
        order.seatNumber
      );

      productCount +=
        Number(order.quantity);

      totalAmount +=
        Number(order.total);

    });


    document.getElementById(
      "studentCount"
    ).textContent =
      studentSet.size + " 人";


    document.getElementById(
      "productCount"
    ).textContent =
      productCount + " 件";


    document.getElementById(
      "totalAmount"
    ).textContent =
      "NT$" + totalAmount;


    document.getElementById(
      "bottomTotal"
    ).textContent =
      "應收：NT$" + totalAmount;


    document.getElementById(
      "unpaidAmount"
    ).textContent =
      "未收：NT$" + totalAmount;


    // ===== 標記已收 =====

    function markPaid(index) {

      const payment =
        document.getElementById(
          "payment-" + index
        );


      if (!payment) {
        return;
      }


      payment.textContent =
        "已收款";

      payment.className =
        "paid";


      const button =
        payment.nextElementSibling;

      button.remove();


      alert(
        "這筆訂單已標記為已收款！"
      );

    }


    // ===== 標記整班已收齊 =====

    function finishCollection() {

      if (classOrders.length === 0) {

        alert(
          "目前沒有需要收款的訂單。"
        );

        return;

      }


      const result =
        confirm(
          "確定 305 班已經收齊所有款項嗎？"
        );


      if (result) {

        alert(
          "305 班已標記為「已收齊」！"
        );

      }

    }

  </script>


</body>

</html>
