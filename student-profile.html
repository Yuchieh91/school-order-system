<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生資料</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .back {
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 45px 20px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 35px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .description {
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .academic-year {
      padding: 14px 16px;
      background: #f3f4f6;
      border-left: 3px solid #222;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .academic-year strong {
      font-size: 18px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8dbe0;
      background: white;
      font-size: 15px;
      font-family: inherit;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #777;
    }

    .save-btn {
      width: 100%;
      padding: 13px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    .save-btn:hover {
      opacity: 0.85;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      background: #f3f4f6;
      font-size: 14px;
      display: none;
    }

    .user-info {
      margin-bottom: 20px;
      padding: 14px;
      background: #f7f7f7;
      font-size: 14px;
      color: #555;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 600px) {
      .header {
        padding: 15px;
      }

      .card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">學生資料</div>
  <a href="index.html" class="back">返回首頁</a>
</header>

<main class="container">

  <div class="card">

    <h1>學生資料</h1>

    <div class="description">
      請填寫目前學年度的班級資料。
    </div>

    <div id="loading" class="loading">
      載入中...
    </div>

    <div id="content" style="display:none;">

      <div class="user-info" id="userInfo"></div>

      <!-- 系統自動顯示目前學年度 -->
      <div class="academic-year">
        目前學年度：
        <strong id="academicYearDisplay">載入中...</strong>
      </div>

      <div class="field">
        <label for="grade">年級</label>

        <select id="grade">
          <option value="">請選擇年級</option>
          <option value="1">一年級</option>
          <option value="2">二年級</option>
          <option value="3">三年級</option>
        </select>
      </div>

      <div class="field">
        <label for="className">班級</label>

        <input
          type="text"
          id="className"
          placeholder="例如：305"
        >
      </div>

      <div class="field">
        <label for="seatNumber">座號</label>

        <input
          type="number"
          id="seatNumber"
          min="1"
          placeholder="例如：12"
        >
      </div>

      <button class="save-btn" id="saveBtn">
        儲存學生資料
      </button>

      <div class="message" id="message"></div>

    </div>

  </div>

</main>

<script>

  // ==========================================
  // Supabase 設定
  // ==========================================

  const SUPABASE_URL = "https://oanccvcpiixtameutjdl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PdSvLOKj8kYTJWan7ivnbQ_G5QIO2ma";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==========================================
  // 目前學年度
  // ==========================================

  let currentAcademicYear = null;


  // ==========================================
  // 取得系統目前學年度
  // ==========================================

  async function loadAcademicYear() {

    const {
      data,
      error
    } = await supabaseClient
      .from("system_settings")
      .select("current_academic_year")
      .eq("id", 1)
      .single();

    if (error) {
      throw new Error(
        "無法取得目前學年度：" + error.message
      );
    }

    currentAcademicYear =
      Number(data.current_academic_year);

    document.getElementById(
      "academicYearDisplay"
    ).textContent =
      currentAcademicYear + " 學年度";
  }


  // ==========================================
  // 取得目前登入者
  // ==========================================

  async function loadProfile() {

    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      showError(
        "無法取得登入狀態：" +
        sessionError.message
      );
      return;
    }

    if (!session) {
      alert("請先使用 Google 登入。");
      window.location.href = "index.html";
      return;
    }

    const user = session.user;

    document.getElementById("userInfo").textContent =
      "目前登入帳號：" +
      (user.email || "");


    // ==========================================
    // 先取得目前學年度
    // ==========================================

    try {

      await loadAcademicYear();

    } catch (error) {

      showError(error.message);
      return;
    }


    // ==========================================
    // 取得「目前學年度」的學生資料
    // ==========================================

    const {
      data,
      error
    } = await supabaseClient
      .from("student_profiles")
      .select(
        "academic_year, grade, class_name, seat_number"
      )
      .eq("user_id", user.id)
      .eq(
        "academic_year",
        String(currentAcademicYear)
      )
      .maybeSingle();


    if (error) {

      showError(
        "讀取學生資料失敗：" +
        error.message
      );

      return;
    }


    // ==========================================
    // 如果已經填過目前學年度資料
    // 就自動帶入
    // ==========================================

    if (data) {

      document.getElementById("grade").value =
        data.grade || "";

      document.getElementById("className").value =
        data.class_name || "";

      document.getElementById("seatNumber").value =
        data.seat_number || "";
    }


    document.getElementById("loading").style.display =
      "none";

    document.getElementById("content").style.display =
      "block";
  }


  // ==========================================
  // 儲存學生資料
  // ==========================================

  document
    .getElementById("saveBtn")
    .addEventListener("click", async () => {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        alert("請先登入。");
        return;
      }

      if (!currentAcademicYear) {

        showError(
          "目前學年度尚未載入，請重新整理頁面。"
        );

        return;
      }

      const user = session.user;


      const grade =
        document.getElementById("grade").value;

      const className =
        document
          .getElementById("className")
          .value
          .trim();

      const seatNumber =
        document.getElementById("seatNumber").value;


      // ==========================================
      // 基本檢查
      // ==========================================

      if (!grade || !className || !seatNumber) {

        showMessage(
          "請把所有欄位填寫完整。"
        );

        return;
      }


      // ==========================================
      // 儲存目前學年度資料
      // ==========================================

      const {
        error
      } = await supabaseClient
        .from("student_profiles")
        .upsert(
          {
            user_id: user.id,

            academic_year:
              String(currentAcademicYear),

            grade:
              Number(grade),

            class_name:
              className,

            seat_number:
              Number(seatNumber),

            updated_at:
              new Date().toISOString()
          },
          {
            onConflict:
              "user_id,academic_year"
          }
        );


      if (error) {

        showError(
          "儲存失敗：" +
          error.message
        );

        return;
      }


      showMessage(
        "學生資料已成功儲存！"
      );
    });


  // ==========================================
  // 顯示訊息
  // ==========================================

  function showMessage(text) {

    const message =
      document.getElementById("message");

    message.style.display = "block";
    message.textContent = text;
  }


  function showError(text) {

    const message =
      document.getElementById("message");

    message.style.display = "block";
    message.textContent = text;
  }


  // ==========================================
  // 啟動
  // ==========================================

  loadProfile();

</script>

</body>
</html>
