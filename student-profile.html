<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的資料｜校園訂購系統</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #222;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #ddd;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 40px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #333;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .profile-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 30px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 15px;
      background: white;
    }

    .save-button {
      width: 100%;
      padding: 13px;

      background: #222;
      color: white;

      border: none;
      border-radius: 4px;

      cursor: pointer;
      font-size: 16px;
    }

    .save-button:hover {
      background: #444;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      background: #f1f1f1;
      border: 1px solid #ddd;

      display: none;
    }

    .student-id-box {
      margin-top: 25px;
      padding: 15px;
      background: #f5f5f5;
      border: 1px solid #ddd;

      font-size: 14px;
      line-height: 1.7;
    }

    .student-id {
      font-family: monospace;
      font-weight: bold;
      word-break: break-all;
    }

    @media (max-width: 700px) {

      header {
        padding: 0 15px;
      }

      nav a {
        margin-left: 9px;
        font-size: 13px;
      }

      .profile-card {
        padding: 20px;
      }

    }

  </style>
</head>


<body>

<header>

  <div class="logo">
    校園訂購系統
  </div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="product.html">商品</a>
    <a href="orders.html">我的訂單</a>
    <a href="student-profile.html">我的資料</a>
  </nav>

</header>


<div class="container">

  <div class="profile-card">

    <h1>我的資料</h1>

    <div class="description">

      請填寫目前學年度的班級資料。
      <br>
      如果未來升級、轉班或座號改變，
      可以直接修改這裡。
      <br>
      舊訂單會保留當時的資料，不會跟著改變。

    </div>


    <!-- 學年度 -->

    <div class="form-group">

      <label for="academicYear">
        學年度
      </label>

      <select id="academicYear">

        <option value="115">
          115
        </option>

        <option value="116">
          116
        </option>

        <option value="117">
          117
        </option>

      </select>

    </div>


    <!-- 年級 -->

    <div class="form-group">

      <label for="grade">
        年級
      </label>

      <select id="grade">

        <option value="高一">
          高一
        </option>

        <option value="高二">
          高二
        </option>

        <option value="高三">
          高三
        </option>

      </select>

    </div>


    <!-- 班級 -->

    <div class="form-group">

      <label for="className">
        班級
      </label>

      <input
        id="className"
        type="text"
        placeholder="例如：305"
      >

    </div>


    <!-- 座號 -->

    <div class="form-group">

      <label for="seatNumber">
        座號
      </label>

      <input
        id="seatNumber"
        type="number"
        min="1"
        max="99"
        placeholder="例如：3"
      >

    </div>


    <button
      class="save-button"
      onclick="saveProfile()"
    >
      儲存資料
    </button>


    <div
      class="message"
      id="message"
    >
      資料已儲存！
    </div>


    <!-- 學生識別 ID -->

    <div class="student-id-box">

      <strong>學生識別 ID</strong>

      <br>

      這組 ID 是目前測試版用來辨識你的資料。
      <br>
      之後接上 Google 登入後，會改成真正的帳號識別。

      <div
        class="student-id"
        id="studentId"
      >
        建立中...
      </div>

    </div>

  </div>

</div>


<script>

  /*
   * =====================================
   * 建立學生識別 ID
   * =====================================
   *
   * 如果第一次使用，就建立一組 ID。
   *
   * 之後即使修改班級或座號，
   * ID 仍然保持不變。
   *
   */

  function getStudentId() {

    let studentId =
      localStorage.getItem("studentId");


    if (!studentId) {

      studentId =
        "student_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 8);


      localStorage.setItem(
        "studentId",
        studentId
      );

    }


    return studentId;

  }


  /*
   * =====================================
   * 顯示學生 ID
   * =====================================
   */

  document.getElementById("studentId").textContent =
    getStudentId();


  /*
   * =====================================
   * 讀取原本的資料
   * =====================================
   */

  const savedProfile =
    JSON.parse(
      localStorage.getItem("studentProfile")
    );


  if (savedProfile) {

    document.getElementById("academicYear").value =
      savedProfile.academicYear || "115";

    document.getElementById("grade").value =
      savedProfile.grade || "高一";

    document.getElementById("className").value =
      savedProfile.className || "";

    document.getElementById("seatNumber").value =
      savedProfile.seatNumber || "";

  }


  /*
   * =====================================
   * 儲存資料
   * =====================================
   */

  function saveProfile() {

    const academicYear =
      document.getElementById("academicYear").value;

    const grade =
      document.getElementById("grade").value;

    const className =
      document.getElementById("className").value.trim();

    const seatNumber =
      document.getElementById("seatNumber").value;


    /*
     * 檢查班級
     */

    if (!className) {

      alert("請輸入班級！");
      return;

    }


    /*
     * 檢查座號
     */

    if (!seatNumber) {

      alert("請輸入座號！");
      return;

    }


    /*
     * 取得學生 ID
     */

    const studentId =
      getStudentId();


    /*
     * 儲存學生資料
     */

    const profile = {

      studentId: studentId,

      academicYear: academicYear,

      grade: grade,

      className: className,

      seatNumber: seatNumber

    };


    localStorage.setItem(
      "studentProfile",
      JSON.stringify(profile)
    );


    /*
     * 顯示成功訊息
     */

    const message =
      document.getElementById("message");

    message.style.display = "block";

    message.textContent =
      "資料已儲存！";


    /*
     * 重新顯示 ID
     */

    document.getElementById("studentId").textContent =
      studentId;

  }

</script>

</body>
</html>
