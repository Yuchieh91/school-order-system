<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品詳細｜校園訂購平台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #202020;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #e5e5e5;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-size: 15px;
    }

    nav a:hover {
      color: #777;
    }

    .page {
      max-width: 1050px;
      margin: 0 auto;
      padding: 45px 25px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #000;
    }

    .product-detail {
      background: white;
      border: 1px solid #e3e3e3;
      border-radius: 5px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      overflow: hidden;
    }

    .product-image {
      min-height: 500px;
      background: #e9e9e9;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;
    }

    .product-content {
      padding: 45px;
    }

    .product-category {
      color: #888;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .product-title {
      margin: 0 0 15px;
      font-size: 32px;
    }

    .product-price {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .description {
      color: #666;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .option-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .size-options {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .size-button {
      min-width: 50px;
      padding: 9px 14px;

      border: 1px solid #d5d5d5;
      background: white;

      border-radius: 3px;
      cursor: pointer;
    }

    .size-button.selected {
      background: #202020;
      color: white;
      border-color: #202020;
    }

    .quantity-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .quantity-button {
      width: 36px;
      height: 36px;

      border: 1px solid #d5d5d5;
      background: white;

      border-radius: 3px;
      cursor: pointer;

      font-size: 18px;
    }

    .quantity-number {
      min-width: 25px;
      text-align: center;
    }

    .add-button {
      width: 100%;

      padding: 13px;

      background: #202020;
      color: white;

      border: none;
      border-radius: 3px;

      cursor: pointer;
      font-size: 15px;
    }

    .add-button:hover {
      background: #444;
    }

    .introduction {
      margin-top: 30px;
      background: white;

      border: 1px solid #e3e3e3;
      border-radius: 5px;

      padding: 30px;
    }

    .introduction h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .introduction p {
      color: #666;
      line-height: 1.8;
    }

    @media (max-width: 750px) {

      header {
        padding: 0 20px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 13px;
      }

      .page {
        padding: 30px 18px;
      }

      .product-detail {
        grid-template-columns: 1fr;
      }

      .product-image {
        min-height: 300px;
      }

      .product-content {
        padding: 30px 25px;
      }

      .product-title {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      校園訂購平台
    </div>

    <nav>
      <a href="index.html">首頁</a>
      <a href="product.html">商品</a>
      <a href="#">我的訂單</a>
      <a href="#">登入</a>
    </nav>

  </header>


  <main class="page">

    <a href="product.html" class="back-link">
      ← 返回商品
    </a>


    <div class="product-detail">

      <div class="product-image">
        商品圖片
      </div>


      <div class="product-content">

        <div class="product-category" id="productCategory">
          商品分類
        </div>

        <h1 class="product-title" id="productName">
          商品名稱
        </h1>

        <div class="product-price" id="productPrice">
          NT$0
        </div>

        <p class="description" id="productDescription">
          商品介紹
        </p>


        <div id="sizeArea">

          <div class="option-title">
            尺寸
          </div>

          <div class="size-options">

            <button class="size-button" onclick="selectSize(this)">
              S
            </button>

            <button class="size-button selected" onclick="selectSize(this)">
              M
            </button>

            <button class="size-button" onclick="selectSize(this)">
              L
            </button>

            <button class="size-button" onclick="selectSize(this)">
              XL
            </button>

          </div>

        </div>


        <div class="option-title">
          數量
        </div>

        <div class="quantity-area">

          <button
            class="quantity-button"
            onclick="changeQuantity(-1)"
          >
            −
          </button>

          <div
            class="quantity-number"
            id="quantity"
          >
            1
          </div>

          <button
            class="quantity-button"
            onclick="changeQuantity(1)"
          >
            ＋
          </button>

        </div>


        <button
          class="add-button"
          onclick="addOrder()"
        >
          加入訂單
        </button>

      </div>

    </div>


    <div class="introduction">

      <h2>
        商品介紹
      </h2>

      <p id="productLongDescription">
        商品詳細介紹。
      </p>

    </div>

  </main>


  <script>

    /*
     * 取得網址中的商品種類
     *
     * 例如：
     * product-detail.html?product=tshirt
     *
     * 就會得到：
     * tshirt
     */

    const params = new URLSearchParams(
      window.location.search
    );

    const productType = params.get("product");


    /*
     * 商品資料
     *
     * 目前先把資料寫在 JavaScript 裡。
     * 之後我們會把這裡升級成真正的資料庫。
     */

    const products = {

      tshirt: {
        name: "校園紀念 T-shirt",
        price: 450,
        category: "上衣",
        description: "校園紀念 T-shirt，適合日常穿著與校園活動。",
        longDescription: "這是一款校園紀念 T-shirt，可以作為校慶、社團活動或日常穿著使用。",
        hasSize: true
      },

      jacket: {
        name: "校園紀念外套",
        price: 850,
        category: "外套",
        description: "適合秋冬穿著的校園紀念外套。",
        longDescription: "校園紀念外套，適合天氣較涼時穿著，也可以作為班級或校園活動服裝。",
        hasSize: true
      },

      canvasbag: {
        name: "校園紀念帆布袋",
        price: 250,
        category: "其他",
        description: "簡單實用的校園紀念帆布袋。",
        longDescription: "可以用來放置課本、筆記本或日常用品，適合學生平常使用。",
        hasSize: false
      },

      notebook: {
        name: "校園筆記本",
        price: 120,
        category: "文具",
        description: "適合上課、讀書與日常筆記使用。",
        longDescription: "校園筆記本可以用於課堂筆記、讀書計畫或其他學習紀錄。",
        hasSize: false
      },

      badge: {
        name: "校園徽章",
        price: 80,
        category: "其他",
        description: "校園紀念徽章。",
        longDescription: "可以別在書包、衣服或其他地方，作為校園紀念品。",
        hasSize: false
      },

      bag: {
        name: "校園帆布袋",
        price: 250,
        category: "其他",
        description: "實用的校園帆布袋。",
        longDescription: "適合上學、購物或日常使用的帆布袋。",
        hasSize: false
      }

    };


    /*
     * 找到目前商品
     */

    const product = products[productType];


    /*
     * 如果找不到商品，
     * 就回到商品列表。
     */

    if (!product) {

      alert("找不到這個商品");

      window.location.href = "product.html";

    }


    /*
     * 把商品資料放進畫面
     */

    if (product) {

      document.getElementById("productName").textContent =
        product.name;

      document.getElementById("productPrice").textContent =
        "NT$" + product.price;

      document.getElementById("productCategory").textContent =
        product.category;

      document.getElementById("productDescription").textContent =
        product.description;

      document.getElementById("productLongDescription").textContent =
        product.longDescription;


      /*
       * 如果商品沒有尺寸，
       * 就把尺寸選擇區隱藏。
       */

      if (!product.hasSize) {

        document.getElementById("sizeArea").style.display =
          "none";

      }

    }


    /*
     * 數量
     */

    let quantity = 1;


    function changeQuantity(number) {

      quantity += number;

      if (quantity < 1) {
        quantity = 1;
      }

      document.getElementById("quantity").textContent =
        quantity;

    }


    /*
     * 選擇尺寸
     */

    function selectSize(button) {

      const buttons =
        document.querySelectorAll(".size-button");

      buttons.forEach(function(item) {

        item.classList.remove("selected");

      });

      button.classList.add("selected");

    }


    /*
     * 加入訂單
     *
     * 目前只是測試功能。
     * 真正的訂單資料庫之後再做。
     */

    function addOrder() {

      let selectedSize = "";

      const selectedButton =
        document.querySelector(".size-button.selected");

      if (selectedButton) {

        selectedSize =
          selectedButton.textContent;

      }

      alert(
        "已加入訂單！\n\n" +
        "商品：" + product.name + "\n" +
        "數量：" + quantity +
        (selectedSize
          ? "\n尺寸：" + selectedSize
          : "")
      );

    }

  </script>

</body>
</html>
