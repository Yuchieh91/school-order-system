<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳細｜校園訂購系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #222;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #333;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .product-detail {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .product-image {
      background: #e5e5e5;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      border-radius: 5px;
    }

    .category {
      display: inline-block;
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 30px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }

    .description {
      line-height: 1.8;
      color: #555;
      margin-bottom: 25px;
    }

    .option-title {
      font-weight: bold;
      margin: 20px 0 10px;
    }

    .size-buttons {
      display: flex;
      gap: 8px;
    }

    .size-button {
      background: white;
      border: 1px solid #bbb;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
    }

    .size-button.selected {
      background: #222;
      color: white;
      border-color: #222;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-box button {
      width: 36px;
      height: 36px;
      border: 1px solid #bbb;
      background: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 18px;
    }

    #quantity {
      width: 50px;
      text-align: center;
      font-size: 16px;
    }

    .add-button {
      width: 100%;
      margin-top: 30px;
      padding: 15px;
      background: #222;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    .add-button:hover {
      background: #444;
    }

    .info-box {
      margin-top: 25px;
      padding: 15px;
      background: #f1f1f1;
      border-left: 4px solid #555;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 15px;
      }

      nav a {
        margin-left: 10px;
        font-size: 13px;
      }

      .product-detail {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .product-image {
        height: 300px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">校園訂購系統</div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="product.html">商品</a>
    <a href="orders.html">我的訂單</a>
    <a href="student-profile.html">我的資料</a>
  </nav>
</header>

<div class="container">

  <a href="product.html" class="back">← 回到商品列表</a>

  <div class="product-detail">

    <div class="product-image">
      商品圖片
    </div>

    <div>

      <span class="category" id="productCategory"></span>

      <h1 id="productName">商品名稱</h1>

      <div class="price">
        NT$ <span id="productPrice">0</span>
      </div>

      <div class="description" id="productDescription"></div>

      <div id="sizeSection">
        <div class="option-title">尺寸</div>

        <div class="size-buttons">
          <button class="size-button" onclick="selectSize(this)">S</button>
          <button class="size-button selected" onclick="selectSize(this)">M</button>
          <button class="size-button" onclick="selectSize(this)">L</button>
          <button class="size-button" onclick="selectSize(this)">XL</button>
        </div>
      </div>

      <div class="option-title">數量</div>

      <div class="quantity-box">
        <button onclick="changeQuantity(-1)">−</button>

        <input
          id="quantity"
          type="number"
          value="1"
          min="1"
          readonly
        >

        <button onclick="changeQuantity(1)">＋</button>
      </div>

      <button class="add-button" onclick="addOrder()">
        立即下單
      </button>

      <div class="info-box">
        下單後，訂單會交由班級幹部統一確認與收款。
        <br>
        請確認「我的資料」中的學年度、班級與座號正確。
      </div>

    </div>

  </div>

</div>

<script>

  // =========================
  // 商品資料
  // =========================

  const products = {

    tshirt: {
      name: "校園紀念 T-shirt",
      price: 450,
      category: "上衣",
      description: "校園紀念 T-shirt，適合日常穿著與校園活動使用。",
      hasSize: true
    },

    jacket: {
      name: "校園紀念外套",
      price: 850,
      category: "外套",
      description: "校園紀念外套，適合秋冬季節與校園活動穿著。",
      hasSize: true
    },

    canvasbag: {
      name: "校園紀念帆布袋",
      price: 250,
      category: "其他",
      description: "簡約實用的校園紀念帆布袋。",
      hasSize: false
    },

    notebook: {
      name: "校園筆記本",
      price: 120,
      category: "文具",
      description: "適合課堂筆記與日常使用的校園筆記本。",
      hasSize: false
    },

    badge: {
      name: "校園徽章",
      price: 80,
      category: "其他",
      description: "校園紀念徽章，可作為書包或衣物上的裝飾。",
      hasSize: false
    },

    bag: {
      name: "校園帆布袋",
      price: 250,
      category: "其他",
      description: "適合上課、社團活動與日常使用的帆布袋。",
      hasSize: false
    }

  };


  // =========================
  // 取得商品
  // =========================

  const params = new URLSearchParams(window.location.search);

  const productId = params.get("product");

  const product = products[productId];


  if (!product) {

    document.getElementById("productName").textContent = "找不到商品";

  } else {

    document.getElementById("productName").textContent = product.name;

    document.getElementById("productPrice").textContent =
      product.price;

    document.getElementById("productCategory").textContent =
      product.category;

    document.getElementById("productDescription").textContent =
      product.description;

    if (!product.hasSize) {
      document.getElementById("sizeSection").style.display = "none";
    }

  }


  // =========================
  // 尺寸選擇
  // =========================

  let selectedSize = "M";


  function selectSize(button) {

    document.querySelectorAll(".size-button").forEach(function(btn) {
      btn.classList.remove("selected");
    });

    button.classList.add("selected");

    selectedSize = button.textContent.trim();

  }


  // =========================
  // 數量
  // =========================

  function changeQuantity(change) {

    const quantityInput =
      document.getElementById("quantity");

    let quantity =
      parseInt(quantityInput.value);

    quantity += change;

    if (quantity < 1) {
      quantity = 1;
    }

    quantityInput.value = quantity;

  }


  // =========================
  // 建立訂單
  // =========================

  function addOrder() {

    if (!product) {
      alert("找不到商品！");
      return;
    }


    // 讀取「我的資料」
    const profile =
      JSON.parse(localStorage.getItem("studentProfile"));


    // 如果還沒有設定學生資料
    if (!profile) {

      alert(
        "請先設定學生資料！\n\n" +
        "接下來會前往「我的資料」。"
      );

      window.location.href =
        "student-profile.html";

      return;
    }


    // 檢查班級
    if (!profile.className) {

      alert("請先填寫班級！");
      window.location.href =
        "student-profile.html";

      return;
    }


    // 檢查座號
    if (!profile.seatNumber) {

      alert("請先填寫座號！");
      window.location.href =
        "student-profile.html";

      return;
    }


    // 取得目前數量
    const quantity =
      parseInt(
        document.getElementById("quantity").value
      );


    // 取得目前訂單
    const orders =
      JSON.parse(
        localStorage.getItem("schoolOrders")
      ) || [];


    // 建立訂單編號
    const orderNumber =
      profile.academicYear +
      String(orders.length + 1).padStart(4, "0");


    // 訂單建立時間
    const orderTime =
      new Date().toLocaleString("zh-TW");


    // =========================
    // 建立新訂單
    // =========================

    const newOrder = {

      orderNumber: orderNumber,

      orderTime: orderTime,

      status: "等待班代收款",

      paymentStatus: "unpaid",

      // 從「我的資料」取得
      academicYear: profile.academicYear,

      grade: profile.grade,

      className: profile.className,

      seatNumber: String(profile.seatNumber),

      // 商品資訊
      name: product.name,

      category: product.category,

      price: product.price,

      quantity: quantity,

      size: product.hasSize
        ? selectedSize
        : "",

      total:
        product.price * quantity

    };


    // 加入訂單
    orders.push(newOrder);


    // 儲存訂單
    localStorage.setItem(
      "schoolOrders",
      JSON.stringify(orders)
    );


    // 成功提示
    alert(
      "訂單建立成功！\n\n" +
      "訂單編號：" +
      orderNumber +
      "\n\n" +
      "學年度：" +
      profile.academicYear +
      "\n" +
      "班級：" +
      profile.className +
      "\n" +
      "座號：" +
      profile.seatNumber
    );


    // 前往我的訂單
    window.location.href =
      "orders.html";

  }

</script>

</body>
</html>
