<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品詳細｜校園訂購系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-size: 14px;
    }

    nav a:hover {
      color: #111;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 45px 24px 70px;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #111;
    }

    .product-detail {
      background: #fff;
      border: 1px solid #e2e4e8;

      display: grid;
      grid-template-columns: 1fr 1fr;

      min-height: 520px;
    }

    .product-image {
      background: #eceef1;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;
      font-size: 15px;
    }

    .product-info {
      padding: 42px;
    }

    .category {
      color: #888;
      font-size: 13px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 30px;
    }

    .price {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .description {
      color: #666;
      line-height: 1.8;
      font-size: 15px;

      padding-bottom: 25px;
      border-bottom: 1px solid #eee;
    }

    .option {
      margin-top: 25px;
    }

    .option label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    select,
    input {
      width: 100%;
      padding: 11px 12px;

      border: 1px solid #d7d9dd;
      background: white;

      font-size: 14px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity input {
      width: 100px;
    }

    .add-button {
      width: 100%;

      margin-top: 30px;
      padding: 14px;

      border: none;
      background: #222;
      color: white;

      font-size: 15px;
      cursor: pointer;
    }

    .add-button:hover {
      background: #444;
    }

    .message {
      text-align: center;
      padding: 70px 20px;
      color: #777;
    }

    .error {
      color: #b42318;
      background: #fff0ee;
      border: 1px solid #f2c4bd;
      padding: 18px;
    }

    .success {
      margin-top: 18px;
      padding: 14px;

      background: #edf7ed;
      border: 1px solid #c9e6c9;

      color: #286128;
      font-size: 14px;
    }

    @media (max-width: 750px) {

      header {
        padding: 16px 20px;
      }

      .product-detail {
        grid-template-columns: 1fr;
      }

      .product-image {
        min-height: 280px;
      }

      .product-info {
        padding: 28px;
      }

      h1 {
        font-size: 26px;
      }
    }

    @media (max-width: 500px) {

      main {
        padding: 30px 16px 50px;
      }

      nav {
        gap: 10px;
      }

      nav a {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    校園訂購系統
  </div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="product.html">商品</a>
    <a href="orders.html">我的訂單</a>
  </nav>

</header>


<main>

  <a href="product.html" class="back">
    ← 返回商品
  </a>


  <div id="message" class="message">
    商品讀取中……
  </div>


  <div
    id="productDetail"
    class="product-detail"
    style="display:none;"
  >

    <div class="product-image">
      商品圖片
    </div>


    <div class="product-info">

      <div id="category" class="category"></div>

      <h1 id="productName"></h1>

      <div id="price" class="price"></div>

      <div id="description" class="description"></div>


      <!-- 尺寸 -->

      <div
        id="sizeOption"
        class="option"
        style="display:none;"
      >

        <label for="size">
          尺寸
        </label>

        <select id="size">

          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>

        </select>

      </div>


      <!-- 數量 -->

      <div class="option">

        <label for="quantity">
          數量
        </label>

        <div class="quantity">

          <input
            id="quantity"
            type="number"
            min="1"
            value="1"
          >

        </div>

      </div>


      <button
        id="addButton"
        class="add-button"
      >
        加入訂單
      </button>


      <div
        id="successMessage"
        class="success"
        style="display:none;"
      >
        已加入訂單！
      </div>

    </div>

  </div>

</main>


<script>

  /* =====================================
     Supabase 設定
     ===================================== */

  const SUPABASE_URL = "https://oanccvcpiixtameutjdl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PdSvLOKj8kYTJWan7ivnbQ_G5QIO2ma";


  /* =====================================
     取得網址中的 productId
     ===================================== */

  const params =
    new URLSearchParams(window.location.search);

  const productId =
    params.get("productId");


  /* =====================================
     HTML 防注入
     ===================================== */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================
     讀取商品
     ===================================== */

  async function loadProduct() {

    const message =
      document.getElementById("message");

    const detail =
      document.getElementById("productDetail");


    if (!productId) {

      message.innerHTML =
        `<div class="error">
          找不到商品。
        </div>`;

      return;

    }


    try {

      const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/products" +
        "?select=id,name,category,price,has_size,description" +
        "&id=eq." +
        encodeURIComponent(productId) +
        "&active=eq.true",

        {
          method: "GET",

          headers: {

            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY

          }

        }

      );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          "Supabase 連線失敗：" +
          response.status +
          "\n" +
          errorText
        );

      }


      const products =
        await response.json();


      if (products.length === 0) {

        message.innerHTML =
          `<div class="error">
            找不到這個商品。
          </div>`;

        return;

      }


      const product =
        products[0];


      /* 商品資訊 */

      document.getElementById("category")
        .textContent =
        product.category || "";


      document.getElementById("productName")
        .textContent =
        product.name;


      document.getElementById("price")
        .textContent =
        "NT$ " +
        Number(product.price)
          .toLocaleString();


      document.getElementById("description")
        .textContent =
        product.description ||
        "目前沒有商品介紹。";


      /* 是否需要尺寸 */

      if (product.has_size) {

        document.getElementById("sizeOption")
          .style.display = "block";

      }


      message.style.display = "none";

      detail.style.display = "grid";


      /* 加入訂單 */

      document.getElementById("addButton")
        .addEventListener(
          "click",
          () => addToOrder(product)
        );


    } catch (error) {

      console.error(error);

      message.innerHTML =
        `<div class="error">
          商品讀取失敗。<br><br>
          ${escapeHTML(error.message)}
        </div>`;

    }

  }


  /* =====================================
     暫時加入本機訂單
     ===================================== */

  function addToOrder(product) {

    const quantity =
      Number(
        document.getElementById("quantity").value
      );


    if (!quantity || quantity < 1) {

      alert("請輸入正確的數量。");

      return;

    }


    let size = null;


    if (product.has_size) {

      size =
        document.getElementById("size").value;

    }


    const orderItem = {

      productId: product.id,

      productName: product.name,

      price: product.price,

      quantity: quantity,

      size: size

    };


    /*
      目前先存在 localStorage。
      等登入與 orders 資料表完成後，
      這裡會改成真正寫入 Supabase。
    */

    let cart =
      JSON.parse(
        localStorage.getItem("schoolCart") || "[]"
      );


    cart.push(orderItem);


    localStorage.setItem(
      "schoolCart",
      JSON.stringify(cart)
    );


    const success =
      document.getElementById("successMessage");


    success.style.display = "block";


    setTimeout(() => {

      success.style.display = "none";

    }, 2500);

  }


  /* =====================================
     啟動
     ===================================== */

  loadProduct();

</script>

</body>
</html>
