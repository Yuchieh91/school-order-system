<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品詳細｜校園訂購平台</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #202020;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #444;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #000;
    }

    .page {
      width: 86%;
      max-width: 1100px;
      margin: 50px auto;
    }

    .back {
      display: inline-block;
      color: #666;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .product-detail {
      background: white;
      border: 1px solid #ddd;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      padding: 35px;
    }

    .product-image {
      min-height: 430px;
      background: #eeeeee;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;
      font-size: 15px;
    }

    .product-info {
      padding: 15px 5px;
    }

    .product-name {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .product-description {
      color: #777;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .price {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .option-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .sizes {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .size {
      width: 52px;
      height: 40px;

      background: white;
      border: 1px solid #ccc;

      border-radius: 3px;

      cursor: pointer;
    }

    .size:hover,
    .size.selected {
      background: #202020;
      color: white;
      border-color: #202020;
    }

    .quantity {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
    }

    .quantity button {
      width: 38px;
      height: 38px;

      background: white;
      border: 1px solid #ccc;

      font-size: 18px;
      cursor: pointer;
    }

    .quantity span {
      width: 45px;
      text-align: center;
    }

    .order-button {
      width: 100%;

      padding: 15px;

      background: #202020;
      color: white;

      border: none;
      border-radius: 3px;

      font-size: 15px;
      cursor: pointer;
    }

    .order-button:hover {
      background: #444;
    }

    .description-section {
      margin-top: 45px;
      background: white;
      border: 1px solid #ddd;
      padding: 30px;
    }

    .description-section h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .description-section p {
      color: #666;
      line-height: 1.8;
    }

    footer {
      margin-top: 80px;
      border-top: 1px solid #ddd;
      padding: 30px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 750px) {

      header {
        padding: 0 5%;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 12px;
      }

      .page {
        width: 90%;
      }

      .product-detail {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .product-image {
        min-height: 280px;
      }

      .product-name {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      🏫 校園訂購平台
    </div>

    <nav>
      <a href="index.html">首頁</a>
      <a href="product.html">商品</a>
      <a href="#">我的訂單</a>
      <a href="#">登入</a>
    </nav>

  </header>


  <main class="page">

    <a href="product.html" class="back">
      ← 返回商品
    </a>


    <div class="product-detail">

      <div class="product-image">
        商品圖片
      </div>


      <div class="product-info">

        <h1 class="product-name">
          校園紀念 T-shirt
        </h1>

        <p class="product-description">
          115 學年度校園紀念服。<br>
          適合校園日常穿著，也可以作為學年度紀念。
        </p>

        <div class="price">
          NT$ 450
        </div>


        <div class="option-title">
          尺寸
        </div>

        <div class="sizes">

          <button class="size">
            S
          </button>

          <button class="size selected">
            M
          </button>

          <button class="size">
            L
          </button>

          <button class="size">
            XL
          </button>

        </div>


        <div class="option-title">
          數量
        </div>

        <div class="quantity">

          <button onclick="changeQuantity(-1)">
            −
          </button>

          <span id="quantity">
            1
          </span>

          <button onclick="changeQuantity(1)">
            +
          </button>

        </div>


        <button class="order-button" onclick="addOrder()">
          加入訂單
        </button>

      </div>

    </div>


    <section class="description-section">

      <h2>
        商品介紹
      </h2>

      <p>
        這是 115 學年度校園紀念商品。
        商品尺寸、價格與訂購期限可以依照學生會實際提供的資訊修改。
      </p>

    </section>

  </main>


  <footer>
    校園訂購平台 © 2026
  </footer>


  <script>

    let quantity = 1;

    function changeQuantity(number) {

      quantity += number;

      if (quantity < 1) {
        quantity = 1;
      }

      document.getElementById("quantity").textContent = quantity;
    }


    function addOrder() {

      alert(
        "已加入訂單！\n\n" +
        "校園紀念 T-shirt\n" +
        "數量：" + quantity
      );

    }


    const sizes = document.querySelectorAll(".size");

    sizes.forEach(function(size) {

      size.addEventListener("click", function() {

        sizes.forEach(function(item) {
          item.classList.remove("selected");
        });

        this.classList.add("selected");

      });

    });

  </script>

</body>
</html>
