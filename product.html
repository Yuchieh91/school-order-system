<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品｜校園訂購平台</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #202020;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #ddd;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 7%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #444;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #000;
    }

    .page {
      width: 86%;
      max-width: 1150px;
      margin: 50px auto;
    }

    .page-title {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .page-description {
      color: #777;
      margin-bottom: 35px;
    }

    /* 分類 */

    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .category {
      background: white;
      border: 1px solid #ccc;
      padding: 9px 18px;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
    }

    .category.active {
      background: #202020;
      color: white;
      border-color: #202020;
    }

    /* 商品 */

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .product {
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: hidden;
    }

    .product-image {
      height: 240px;
      background: #eeeeee;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;
      font-size: 14px;
    }

    .product-info {
      padding: 20px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .product-description {
      color: #888;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price {
      font-weight: 600;
    }

    .view-button {
      background: #202020;
      color: white;
      border: none;

      padding: 9px 15px;

      border-radius: 3px;

      cursor: pointer;

      text-decoration: none;
      display: inline-block;
    }

    .view-button:hover {
      background: #444;
    }

    footer {
      margin-top: 80px;
      border-top: 1px solid #ddd;
      padding: 30px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 750px) {

      header {
        padding: 0 5%;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 12px;
      }

      .page {
        width: 90%;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 30px;
      }
    }
  </style>
</head>
