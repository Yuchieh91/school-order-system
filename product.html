<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品｜校園訂購系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    /* ===== 頂部 ===== */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #222;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-size: 14px;
    }

    nav a:hover {
      color: #111;
    }

    /* ===== 主內容 ===== */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .page-title p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    /* ===== 分類 ===== */

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .category-btn {
      border: 1px solid #d7d9dd;
      background: #fff;
      padding: 9px 16px;
      cursor: pointer;
      font-size: 14px;
      color: #444;
    }

    .category-btn:hover {
      background: #f0f1f3;
    }

    .category-btn.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    /* ===== 商品 ===== */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #e2e4e8;
      padding: 0;
      transition: 0.2s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .product-image {
      height: 210px;
      background: #eceef1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
    }

    .product-info {
      padding: 18px;
    }

    .product-category {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .view-btn {
      display: block;
      text-align: center;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 11px;
      font-size: 14px;
    }

    .view-btn:hover {
      background: #444;
    }

    /* ===== 狀態 ===== */

    .message {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .error {
      color: #b42318;
      background: #fff0ee;
      border: 1px solid #f2c4bd;
      padding: 16px;
      margin-bottom: 20px;
    }

    /* ===== 平板 ===== */

    @media (max-width: 800px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      header {
        padding: 16px 20px;
      }

      nav {
        gap: 10px;
      }
    }

    /* ===== 手機 ===== */

    @media (max-width: 520px) {
      main {
        padding: 30px 16px 50px;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 26px;
      }

      nav a {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">校園訂購系統</div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="orders.html">我的訂單</a>
    <a href="student-profile.html">個人資料</a>
  </nav>
</header>


<main>

  <div class="page-title">
    <h1>商品</h1>
    <p>瀏覽目前可以訂購的校園商品</p>
  </div>


  <!-- 商品分類 -->

  <div class="categories" id="categories">
    <button class="category-btn active" data-category="全部">
      全部
    </button>
  </div>


  <!-- 商品 -->

  <div id="message" class="message">
    商品讀取中……
  </div>

  <div
    id="productsGrid"
    class="products-grid"
    style="display:none;"
  ></div>

</main>


<script>

  /* =====================================
     Supabase 設定
     ===================================== */

  const SUPABASE_URL = "https://oanccvcpiixtameutjdl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PdSvLOKj8kYTJWan7ivnbQ_G5QIO2ma";


  /* =====================================
     全部商品
     ===================================== */

  let allProducts = [];


  /* =====================================
     讀取商品
     ===================================== */

  async function loadProducts() {

    const message = document.getElementById("message");
    const productsGrid = document.getElementById("productsGrid");

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=id,name,category,price,has_size,description&active=eq.true&order=id",
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        }
      );


      if (!response.ok) {

        const errorText = await response.text();

        throw new Error(
          "Supabase 連線失敗：" +
          response.status +
          "\n" +
          errorText
        );

      }


      allProducts = await response.json();


      if (allProducts.length === 0) {

        message.textContent = "目前沒有可以訂購的商品。";
        return;

      }


      createCategories();

      renderProducts(allProducts);


    } catch (error) {

      console.error(error);

      message.innerHTML =
        `<div class="error">
          商品讀取失敗。<br><br>
          ${error.message}
        </div>`;

    }

  }


  /* =====================================
     建立分類按鈕
     ===================================== */

  function createCategories() {

    const categoriesElement =
      document.getElementById("categories");

    const categories = [
      ...new Set(
        allProducts.map(product => product.category)
      )
    ];


    categories.forEach(category => {

      const button =
        document.createElement("button");

      button.className = "category-btn";

      button.textContent = category;

      button.dataset.category = category;


      button.addEventListener("click", () => {

        document
          .querySelectorAll(".category-btn")
          .forEach(btn => {
            btn.classList.remove("active");
          });

        button.classList.add("active");


        if (category === "全部") {

          renderProducts(allProducts);

        } else {

          const filtered =
            allProducts.filter(
              product =>
                product.category === category
            );

          renderProducts(filtered);

        }

      });


      categoriesElement.appendChild(button);

    });


    /* 全部按鈕 */

    const allButton =
      document.querySelector(
        '.category-btn[data-category="全部"]'
      );


    allButton.addEventListener("click", () => {

      document
        .querySelectorAll(".category-btn")
        .forEach(btn => {
          btn.classList.remove("active");
        });

      allButton.classList.add("active");

      renderProducts(allProducts);

    });

  }


  /* =====================================
     顯示商品
     ===================================== */

  function renderProducts(products) {

    const message =
      document.getElementById("message");

    const grid =
      document.getElementById("productsGrid");


    message.style.display = "none";

    grid.style.display = "grid";

    grid.innerHTML = "";


    products.forEach(product => {

      const card =
        document.createElement("div");

      card.className = "product-card";


      card.innerHTML = `

        <div class="product-image">
          商品圖片
        </div>

        <div class="product-info">

          <div class="product-category">
            ${escapeHTML(product.category)}
          </div>

          <div class="product-name">
            ${escapeHTML(product.name)}
          </div>

          <div class="product-price">
            NT$ ${Number(product.price).toLocaleString()}
          </div>

          <a
            class="view-btn"
            href="product-detail.html?productId=${product.id}"
          >
            查看商品
          </a>

        </div>

      `;


      grid.appendChild(card);

    });

  }


  /* =====================================
     防止 HTML 注入
     ===================================== */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================
     啟動
     ===================================== */

  loadProducts();

</script>

</body>
</html>
