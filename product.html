<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品｜校園訂購平台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: #f6f6f4;
      color: #202020;
    }

    /* ===== Header ===== */

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #e5e5e5;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-size: 15px;
    }

    nav a:hover {
      color: #777;
    }


    /* ===== Page ===== */

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 55px 25px;
    }

    .page-title {
      margin-bottom: 35px;
    }

    .page-title h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .page-title p {
      margin: 0;
      color: #777;
    }


    /* ===== Category ===== */

    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .category {
      padding: 9px 18px;
      border: 1px solid #d8d8d8;
      background: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
    }

    .category.active {
      background: #202020;
      color: white;
      border-color: #202020;
    }


    /* ===== Product Grid ===== */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }


    /* ===== Product Card ===== */

    .product-card {
      background: white;
      border: 1px solid #e3e3e3;
      border-radius: 5px;
      overflow: hidden;
    }

    .product-image {
      height: 230px;
      background: #e9e9e9;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #999;
      font-size: 14px;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .product-category {
      font-size: 13px;
      color: #888;
      margin-bottom: 15px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price {
      font-size: 17px;
      font-weight: 700;
    }


    /* ===== Button ===== */

    .view-button {
      background: #202020;
      color: white;

      border: none;
      padding: 9px 15px;

      border-radius: 3px;

      cursor: pointer;
      text-decoration: none;
      display: inline-block;

      font-size: 14px;
    }

    .view-button:hover {
      background: #444;
    }


    /* ===== Responsive ===== */

    @media (max-width: 800px) {

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }


    @media (max-width: 550px) {

      header {
        padding: 0 20px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 13px;
      }

      .page {
        padding: 40px 18px;
      }

      .page-title h1 {
        font-size: 28px;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>
